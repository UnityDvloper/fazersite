<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebStudio — Editor de Código</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --sidebar-bg: #161b22;
    --tab-bar: #0d1117;
    --active-tab: #1e2530;
    --border: #21262d;
    --text: #c9d1d9;
    --text-muted: #6e7681;
    --accent: #58a6ff;
    --accent2: #3fb950;
    --accent3: #d2a8ff;
    --accent4: #ffa657;
    --accent5: #f85149;
    --hover: #1f2937;
    --selection: #1f3a5f;
    --line-num: #495057;
    --status-bg: #1565c0;
    --editor-bg: #0d1117;
    --gutter: #161b22;
    --tooltip: #21262d;
    --scrollbar: #30363d;
    --keyword: #ff7b72;
    --string: #a5d6ff;
    --comment: #8b949e;
    --number: #79c0ff;
    --function: #d2a8ff;
    --tag: #7ee787;
    --attr: #79c0ff;
    --property: #79c0ff;
    --value: #a5d6ff;
    --selector: #f2cc60;
    --at-rule: #ff7b72;
    --important: #ffa657;
  }
  .theme-light {
    --bg: #f6f8fa;
    --sidebar-bg: #ffffff;
    --tab-bar: #f0f2f4;
    --active-tab: #ffffff;
    --border: #d0d7de;
    --text: #24292f;
    --text-muted: #656d76;
    --accent: #0969da;
    --hover: #eaeef2;
    --selection: #cae8ff;
    --line-num: #8c959f;
    --status-bg: #0969da;
    --editor-bg: #ffffff;
    --gutter: #f6f8fa;
    --scrollbar: #d0d7de;
    --keyword: #cf222e;
    --string: #0a3069;
    --comment: #6e7781;
    --number: #0550ae;
    --function: #8250df;
    --tag: #116329;
    --attr: #0550ae;
    --property: #0550ae;
    --value: #0a3069;
    --selector: #953800;
    --at-rule: #cf222e;
  }
  .theme-monokai {
    --bg: #272822;
    --sidebar-bg: #1e1f1c;
    --tab-bar: #272822;
    --active-tab: #3e3d32;
    --border: #3e3d32;
    --text: #f8f8f2;
    --text-muted: #75715e;
    --accent: #a6e22e;
    --hover: #3e3d32;
    --selection: #49483e;
    --line-num: #75715e;
    --status-bg: #75715e;
    --editor-bg: #272822;
    --gutter: #1e1f1c;
    --scrollbar: #49483e;
    --keyword: #f92672;
    --string: #e6db74;
    --comment: #75715e;
    --number: #ae81ff;
    --function: #a6e22e;
    --tag: #f92672;
    --attr: #a6e22e;
    --property: #66d9e8;
    --value: #e6db74;
    --selector: #a6e22e;
    --at-rule: #f92672;
  }
  .theme-dracula {
    --bg: #282a36;
    --sidebar-bg: #21222c;
    --tab-bar: #21222c;
    --active-tab: #282a36;
    --border: #44475a;
    --text: #f8f8f2;
    --text-muted: #6272a4;
    --accent: #bd93f9;
    --hover: #44475a;
    --selection: #44475a;
    --line-num: #6272a4;
    --status-bg: #6272a4;
    --editor-bg: #282a36;
    --gutter: #21222c;
    --scrollbar: #44475a;
    --keyword: #ff79c6;
    --string: #f1fa8c;
    --comment: #6272a4;
    --number: #bd93f9;
    --function: #50fa7b;
    --tag: #ff79c6;
    --attr: #50fa7b;
    --property: #66d9e8;
    --value: #f1fa8c;
    --selector: #50fa7b;
    --at-rule: #ff79c6;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; font-family:'JetBrains Mono',monospace; background:var(--bg); color:var(--text); font-size:13px; }

  /* ── Layout ── */
  #app { display:flex; flex-direction:column; height:100vh; }
  #titlebar { height:32px; background:var(--sidebar-bg); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 12px; gap:16px; user-select:none; flex-shrink:0; }
  #titlebar .logo { font-family:'Syne',sans-serif; font-weight:800; font-size:15px; color:var(--accent); letter-spacing:-0.5px; }
  #titlebar .menus { display:flex; gap:2px; }
  .menu-btn { padding:2px 10px; border-radius:4px; cursor:pointer; color:var(--text-muted); font-size:12px; font-family:'Syne',sans-serif; transition:all .15s; }
  .menu-btn:hover { background:var(--hover); color:var(--text); }

  #main { display:flex; flex:1; overflow:hidden; }

  /* ── Activity Bar ── */
  #actbar { width:48px; background:var(--sidebar-bg); border-right:1px solid var(--border); display:flex; flex-direction:column; align-items:center; padding:8px 0; gap:4px; flex-shrink:0; }
  .act-btn { width:36px; height:36px; border-radius:8px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-muted); transition:all .15s; position:relative; }
  .act-btn:hover, .act-btn.active { color:var(--text); background:var(--hover); }
  .act-btn.active { color:var(--accent); }
  .act-btn svg { width:20px; height:20px; }

  /* ── Sidebar ── */
  #sidebar { width:240px; background:var(--sidebar-bg); border-right:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; overflow:hidden; transition:width .2s; }
  #sidebar.collapsed { width:0; }
  #sidebar-header { padding:10px 12px 6px; font-size:10px; font-weight:700; color:var(--text-muted); letter-spacing:1.5px; text-transform:uppercase; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); flex-shrink:0; }
  #sidebar-header .actions { display:flex; gap:2px; }
  .icon-btn { width:22px; height:22px; border-radius:4px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-muted); transition:all .15s; }
  .icon-btn:hover { background:var(--hover); color:var(--text); }
  .icon-btn svg { width:14px; height:14px; }
  #file-tree { flex:1; overflow-y:auto; padding:4px 0; }
  .tree-item { display:flex; align-items:center; gap:6px; padding:3px 8px 3px 8px; cursor:pointer; border-radius:4px; margin:1px 4px; transition:background .1s; white-space:nowrap; overflow:hidden; font-size:12.5px; }
  .tree-item:hover { background:var(--hover); }
  .tree-item.active { background:var(--selection); color:var(--accent); }
  .tree-item.folder { color:var(--accent); }
  .tree-item .item-icon { width:16px; height:16px; flex-shrink:0; }
  .tree-item .item-name { flex:1; overflow:hidden; text-overflow:ellipsis; }
  .tree-item .item-actions { display:none; gap:2px; }
  .tree-item:hover .item-actions { display:flex; }
  .tree-item .item-actions svg { width:12px; height:12px; }
  .tree-item[data-indent="1"] { padding-left:24px; }
  .tree-item[data-indent="2"] { padding-left:40px; }

  /* ── Editor area ── */
  #editor-area { flex:1; display:flex; flex-direction:column; overflow:hidden; }
  #tab-bar { height:35px; background:var(--tab-bar); border-bottom:1px solid var(--border); display:flex; align-items:flex-end; overflow-x:auto; flex-shrink:0; }
  #tab-bar::-webkit-scrollbar { height:3px; }
  #tab-bar::-webkit-scrollbar-thumb { background:var(--scrollbar); border-radius:2px; }
  .tab { display:flex; align-items:center; gap:8px; padding:0 14px 0 12px; height:33px; background:var(--tab-bar); border-right:1px solid var(--border); cursor:pointer; color:var(--text-muted); font-size:12px; white-space:nowrap; flex-shrink:0; transition:all .15s; position:relative; }
  .tab.active { background:var(--active-tab); color:var(--text); border-top:2px solid var(--accent); }
  .tab .tab-icon { width:14px; height:14px; }
  .tab .tab-close { width:16px; height:16px; border-radius:3px; display:flex; align-items:center; justify-content:center; opacity:0; transition:all .15s; }
  .tab:hover .tab-close, .tab.active .tab-close { opacity:1; }
  .tab .tab-close:hover { background:var(--hover); color:var(--accent5); }
  .tab .tab-close svg { width:10px; height:10px; }
  .tab .modified { width:8px; height:8px; border-radius:50%; background:var(--accent4); flex-shrink:0; }

  /* ── Code Editor ── */
  #editor-wrapper { flex:1; display:flex; overflow:hidden; position:relative; }
  #editor-container { flex:1; display:flex; overflow:auto; background:var(--editor-bg); position:relative; }
  #editor-container::-webkit-scrollbar { width:10px; height:10px; }
  #editor-container::-webkit-scrollbar-track { background:var(--editor-bg); }
  #editor-container::-webkit-scrollbar-thumb { background:var(--scrollbar); border-radius:5px; border:2px solid var(--editor-bg); }
  #line-numbers { padding:12px 0; background:var(--gutter); border-right:1px solid var(--border); min-width:52px; text-align:right; color:var(--line-num); font-size:13px; line-height:1.6; user-select:none; flex-shrink:0; }
  #line-numbers span { display:block; padding:0 12px 0 8px; }
  #code-area { flex:1; position:relative; }
  #code-display { position:absolute; top:0; left:0; right:0; bottom:0; padding:12px 16px; font-size:13px; line-height:1.6; white-space:pre; pointer-events:none; overflow:hidden; }
  #code-input { position:absolute; top:0; left:0; right:0; bottom:0; padding:12px 16px; font-size:13px; line-height:1.6; white-space:pre; background:transparent; border:none; outline:none; resize:none; color:transparent; caret-color:var(--text); font-family:'JetBrains Mono',monospace; overflow:hidden; tab-size:2; }
  #code-input::selection { background:var(--selection); }

  /* ── Minimap ── */
  #minimap { width:80px; background:var(--editor-bg); border-left:1px solid var(--border); overflow:hidden; position:relative; cursor:pointer; flex-shrink:0; }
  #minimap canvas { width:100%; }

  /* ── Autocomplete ── */
  #autocomplete { position:absolute; background:var(--tooltip); border:1px solid var(--border); border-radius:6px; z-index:100; min-width:220px; max-height:200px; overflow-y:auto; box-shadow:0 8px 24px rgba(0,0,0,.4); display:none; }
  .ac-item { padding:6px 12px; cursor:pointer; display:flex; align-items:center; gap:10px; transition:background .1s; }
  .ac-item:hover, .ac-item.selected { background:var(--hover); }
  .ac-item .ac-kind { font-size:10px; padding:2px 5px; border-radius:3px; font-weight:600; flex-shrink:0; }
  .ac-kind-keyword { background:#ff7b7222; color:var(--keyword); }
  .ac-kind-snippet { background:#a5d6ff22; color:var(--string); }
  .ac-kind-property { background:#79c0ff22; color:var(--property); }
  .ac-kind-function { background:#d2a8ff22; color:var(--function); }
  .ac-kind-tag { background:#7ee78722; color:var(--tag); }
  .ac-item .ac-label { flex:1; font-size:12px; }
  .ac-item .ac-detail { font-size:11px; color:var(--text-muted); }

  /* ── Panels ── */
  #bottom-panel { height:180px; background:var(--sidebar-bg); border-top:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; }
  #panel-tabs { display:flex; border-bottom:1px solid var(--border); height:28px; align-items:flex-end; }
  .panel-tab { padding:0 16px; height:26px; display:flex; align-items:center; font-size:11px; color:var(--text-muted); cursor:pointer; transition:all .15s; }
  .panel-tab.active { color:var(--text); border-bottom:2px solid var(--accent); }
  #panel-content { flex:1; overflow:auto; padding:8px 12px; font-size:12px; }
  #panel-content::-webkit-scrollbar { width:6px; }
  #panel-content::-webkit-scrollbar-thumb { background:var(--scrollbar); border-radius:3px; }
  #console-output { line-height:1.8; }
  .console-line { display:flex; gap:8px; padding:1px 0; }
  .console-line.error { color:var(--accent5); }
  .console-line.warn { color:var(--accent4); }
  .console-line.info { color:var(--accent); }
  .console-prefix { color:var(--text-muted); font-size:10px; padding-top:2px; }

  /* ── Status Bar ── */
  #statusbar { height:22px; background:var(--status-bg); display:flex; align-items:center; padding:0 12px; gap:16px; font-size:11px; flex-shrink:0; }
  .status-item { display:flex; align-items:center; gap:4px; color:rgba(255,255,255,.85); cursor:pointer; padding:0 4px; border-radius:3px; }
  .status-item:hover { background:rgba(255,255,255,.15); }
  .status-sep { color:rgba(255,255,255,.3); }
  #statusbar .spacer { flex:1; }

  /* ── Preview ── */
  #preview-panel { width:0; background:var(--bg); border-left:1px solid var(--border); overflow:hidden; transition:width .2s; display:flex; flex-direction:column; flex-shrink:0; }
  #preview-panel.open { width:45%; }
  #preview-header { height:35px; background:var(--tab-bar); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 12px; gap:8px; flex-shrink:0; }
  #preview-header .title { font-size:11px; color:var(--text-muted); font-family:'Syne',sans-serif; flex:1; }
  #preview-frame { flex:1; border:none; background:white; }

  /* ── Modals ── */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:1000; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
  .modal { background:var(--sidebar-bg); border:1px solid var(--border); border-radius:10px; padding:24px; min-width:360px; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  .modal h3 { font-family:'Syne',sans-serif; font-weight:700; margin-bottom:16px; color:var(--text); }
  .modal input { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:8px 12px; color:var(--text); font-family:'JetBrains Mono',monospace; font-size:13px; outline:none; transition:border .15s; }
  .modal input:focus { border-color:var(--accent); }
  .modal .modal-actions { display:flex; gap:8px; margin-top:16px; justify-content:flex-end; }
  .btn { padding:7px 16px; border-radius:6px; border:none; cursor:pointer; font-family:'Syne',sans-serif; font-weight:600; font-size:12px; transition:all .15s; }
  .btn-primary { background:var(--accent); color:#fff; }
  .btn-primary:hover { filter:brightness(1.15); }
  .btn-ghost { background:transparent; color:var(--text-muted); border:1px solid var(--border); }
  .btn-ghost:hover { background:var(--hover); color:var(--text); }
  .btn-danger { background:var(--accent5); color:#fff; }

  /* ── Theme picker ── */
  #theme-picker { position:absolute; right:12px; bottom:30px; background:var(--tooltip); border:1px solid var(--border); border-radius:8px; padding:8px; z-index:200; box-shadow:0 8px 24px rgba(0,0,0,.4); display:none; }
  #theme-picker.open { display:block; }
  .theme-option { padding:7px 14px; border-radius:5px; cursor:pointer; font-size:12px; transition:background .1s; display:flex; align-items:center; gap:8px; }
  .theme-option:hover { background:var(--hover); }
  .theme-dot { width:10px; height:10px; border-radius:50%; }

  /* ── Drag resize ── */
  #drag-handle { width:4px; background:transparent; cursor:col-resize; flex-shrink:0; transition:background .15s; }
  #drag-handle:hover { background:var(--accent); }

  /* ── Welcome ── */
  #welcome { display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; gap:12px; color:var(--text-muted); }
  #welcome .big { font-family:'Syne',sans-serif; font-size:28px; font-weight:800; color:var(--text); }
  #welcome .sub { font-size:13px; }

  /* ── Scrollbars ── */
  *::-webkit-scrollbar { width:6px; height:6px; }
  *::-webkit-scrollbar-track { background:transparent; }
  *::-webkit-scrollbar-thumb { background:var(--scrollbar); border-radius:3px; }

  /* ── Context menu ── */
  #ctx-menu { position:fixed; background:var(--tooltip); border:1px solid var(--border); border-radius:7px; z-index:500; min-width:180px; padding:4px; box-shadow:0 8px 24px rgba(0,0,0,.4); display:none; }
  .ctx-item { padding:6px 12px; border-radius:4px; cursor:pointer; font-size:12px; transition:background .1s; display:flex; align-items:center; gap:8px; }
  .ctx-item:hover { background:var(--hover); }
  .ctx-item.danger { color:var(--accent5); }
  .ctx-sep { height:1px; background:var(--border); margin:4px 0; }

  /* Image panel */
  #images-panel { padding:8px; display:flex; flex-wrap:wrap; gap:8px; }
  .img-thumb { width:80px; border-radius:6px; border:2px solid var(--border); cursor:pointer; transition:border .15s; }
  .img-thumb:hover { border-color:var(--accent); }
  .img-thumb img { width:100%; height:60px; object-fit:cover; border-radius:4px; display:block; }
  .img-thumb .img-name { font-size:10px; color:var(--text-muted); text-align:center; padding:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
</style>
</head>
<body>

<div id="app">
  <!-- Title Bar -->
  <div id="titlebar">
    <span class="logo">⬡ WebStudio</span>
    <div class="menus">
      <span class="menu-btn" onclick="showNewFileModal()">Arquivo</span>
      <span class="menu-btn" onclick="editMenu()">Editar</span>
      <span class="menu-btn" onclick="togglePreview()">Preview</span>
      <span class="menu-btn" onclick="exportZip()">Exportar ZIP</span>
      <span class="menu-btn" onclick="importFiles()">Importar</span>
    </div>
  </div>

  <div id="main">
    <!-- Activity Bar -->
    <div id="actbar">
      <div class="act-btn active" id="act-explorer" title="Explorer" onclick="setActivity('explorer')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3h8l2 2h8v16H3z"/></svg>
      </div>
      <div class="act-btn" id="act-images" title="Imagens" onclick="setActivity('images')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
      </div>
      <div class="act-btn" id="act-search" title="Buscar" onclick="setActivity('search')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      </div>
      <div style="flex:1"></div>
      <div class="act-btn" title="Configurações" onclick="toggleThemePicker()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </div>
    </div>

    <!-- Sidebar -->
    <div id="sidebar">
      <div id="sidebar-header">
        <span id="sidebar-title">EXPLORER</span>
        <div class="actions">
          <div class="icon-btn" title="Novo Arquivo" onclick="showNewFileModal()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
          </div>
          <div class="icon-btn" title="Nova Pasta" onclick="showNewFolderModal()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
          </div>
          <div class="icon-btn" title="Importar" onclick="importFiles()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          </div>
        </div>
      </div>
      <div id="file-tree"></div>
    </div>

    <!-- Drag Handle -->
    <div id="drag-handle"></div>

    <!-- Editor Area -->
    <div id="editor-area">
      <div id="tab-bar"></div>
      <div id="editor-wrapper">
        <div id="editor-container">
          <div id="welcome">
            <div class="big">WebStudio</div>
            <div class="sub">Crie ou abra um arquivo para começar</div>
            <div style="margin-top:8px;display:flex;gap:12px;">

<script>

// ════════════════════════════════════════════════════════
// FILE LANGUAGE DETECTION
// ════════════════════════════════════════════════════════
function getLanguage(filename) {
  const ext = filename.split('.').pop().toLowerCase();
  return { html:'HTML', css:'CSS', js:'JavaScript' }[ext] || 'Text';
}
function getFileIcon(filename, isFolder) {
  if (isFolder) return `<svg class="item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>`;

  const colors = { html:'#e34c26', css:'#264de4', js:'#f0db4f' };
  const c = colors[ext] || '#8b949e';
  return `<svg class="item-icon" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`;
}

function createFile(path, content='') {

// ════════════════════════════════════════════════════════
// FILE TREE
// ════════════════════════════════════════════════════════
function renderFileTree() {
  const tree = document.getElementById('file-tree');
  if (state.currentActivity === 'images') {
    renderImagesPanel();
    return;
  }
  if (state.currentActivity === 'search') {
    renderSearchPanel();
    return;
  }

  tree.innerHTML = '';
  const allPaths = [...state.folders].concat(Object.keys(state.files));
  
  // Sort: folders first, then files
  const structure = {};
  Object.keys(state.files).forEach(p => {
    const parts = p.split('/').filter(Boolean);
    let cur = structure;
    parts.forEach((part, i) => {
      if (i === parts.length - 1) { cur[part] = 'file:' + p; }
      else { cur[part] = cur[part] || {}; }
      cur = cur[part];
    });
  });

  function renderLevel(obj, indent, parentPath='') {
    const entries = Object.entries(obj);
    const folders = entries.filter(([,v]) => typeof v === 'object');
    const files = entries.filter(([,v]) => typeof v === 'string');
    [...folders, ...files].forEach(([name, val]) => {
      const el = document.createElement('div');
      const fullPath = parentPath + '/' + name;
      el.setAttribute('data-indent', indent);
      if (typeof val === 'object') {
        // Folder
        el.className = 'tree-item folder';
        const expanded = state.expandedFolders.has(fullPath);
        el.innerHTML = `
          ${expanded ? `<svg class="item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>` : `<svg class="item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" fill="currentColor" fill-opacity=".2"/></svg>`}
          <span class="item-name">📁 ${name}</span>
          <div class="item-actions">
            <div class="icon-btn" onclick="showNewFileModal('${fullPath}')" title="Novo arquivo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg></div>
            <div class="icon-btn danger" onclick="deleteFolder('${fullPath}')" title="Excluir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg></div>
          </div>`;
        el.style.paddingLeft = (8 + indent * 16) + 'px';
        el.onclick = (e) => { if (e.target.closest('.item-actions')) return; toggleFolder(fullPath); };
        el.oncontextmenu = (e) => { e.preventDefault(); showCtxMenu(e, 'folder', fullPath); };
        tree.appendChild(el);
        if (expanded) renderLevel(val, indent + 1, fullPath);
      } else {
        // File
        const fpath = val.replace('file:', '');
        el.className = 'tree-item' + (state.activeFile === fpath ? ' active' : '');
        el.innerHTML = `
          ${getFileIcon(name)}
          <span class="item-name">${name}</span>
          <div class="item-actions">
            <div class="icon-btn" onclick="renameFilePrompt('${fpath}')" title="Renomear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></div>
            <div class="icon-btn" onclick="deleteFile('${fpath}')" title="Excluir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg></div>
          </div>`;
        el.style.paddingLeft = (8 + indent * 16) + 'px';
        el.onclick = (e) => { if (e.target.closest('.item-actions')) return; openFile(fpath); };
        el.oncontextmenu = (e) => { e.preventDefault(); showCtxMenu(e, 'file', fpath); };
        tree.appendChild(el);
      }
    });
  }
  renderLevel(structure, 0);
}

function toggleFolder(path) {
  if (state.expandedFolders.has(path)) state.expandedFolders.delete(path);
  else state.expandedFolders.add(path);
  renderFileTree();
}

// ════════════════════════════════════════════════════════
// TABS
// ════════════════════════════════════════════════════════
function openFile(path) {
  if (!state.files[path]) return;
  state.activeFile = path;
  if (!state.openTabs.includes(path)) state.openTabs.push(path);
  renderTabs();
  loadFileInEditor(path);
  renderFileTree();
}

function renderTabs() {
  const bar = document.getElementById('tab-bar');
  bar.innerHTML = '';
  state.openTabs.forEach(path => {
    const name = path.split('/').pop();
    const tab = document.createElement('div');
    tab.className = 'tab' + (state.activeFile === path ? ' active' : '');
    tab.innerHTML = `
      ${getFileIcon(name)}
      <span>${name}</span>
      ${state.modified.has(path) ? '<div class="modified"></div>' : ''}
      <div class="tab-close" onclick="closeTab('${path}',event)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </div>`;
    tab.onclick = () => openFile(path);
    bar.appendChild(tab);
  });
}

function closeTab(path, e) {
  e.stopPropagation();
  const idx = state.openTabs.indexOf(path);
  state.openTabs.splice(idx, 1);
  state.modified.delete(path);
  if (state.activeFile === path) {
    state.activeFile = state.openTabs[Math.max(0, idx - 1)] || null;
    if (state.activeFile) loadFileInEditor(state.activeFile);
    else showWelcome();
  }
  renderTabs();
  renderFileTree();
}

function showWelcome() {
  document.getElementById('welcome').style.display = 'flex';
  document.getElementById('code-area').style.display = 'none';
}

// ════════════════════════════════════════════════════════
// EDITOR
// ════════════════════════════════════════════════════════
function loadFileInEditor(path) {
  const file = state.files[path];
  if (!file) return;
  document.getElementById('welcome').style.display = 'none';
  document.getElementById('code-area').style.display = 'flex';
  const input = document.getElementById('code-input');
  input.value = file.content;
  highlightCode();
  updateLineNumbers();
  updateStatusBar();
}

const codeInput = () => document.getElementById('code-input');
const codeDisplay = () => document.getElementById('code-display');

function highlightCode() {
  const input = codeInput();
  const display = codeDisplay();
  const file = state.files[state.activeFile];
  if (!file) return;
  const text = input.value;
  display.innerHTML = highlight(text, file.language);
  syncScroll();
}

function syncScroll() {
  const input = codeInput();
  const display = codeDisplay();
  display.scrollTop = input.scrollTop;
  display.scrollLeft = input.scrollLeft;
}

function updateLineNumbers() {
  const input = codeInput();
  const lines = input.value.split('\n');
  const ln = document.getElementById('line-numbers');
  ln.innerHTML = lines.map((_,i) => `<span>${i+1}</span>`).join('');
}

// ════════════════════════════════════════════════════════
// SYNTAX HIGHLIGHTING
// ════════════════════════════════════════════════════════
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlight(code, lang) {
  if (lang === 'HTML') return highlightHTML(code);
  if (lang === 'CSS') return highlightCSS(code);
  if (lang === 'JavaScript') return highlightJS(code);
  return escHtml(code);
}

function highlightHTML(code) {
  return escHtml(code)
    .replace(/(&lt;!--[\s\S]*?--&gt;)/g, '<span style="color:var(--comment)">$1</span>')
    .replace(/(&lt;\/?)([\w-]+)/g, '<span style="color:var(--keyword)">$1</span><span style="color:var(--tag)">$2</span>')
    .replace(/([\w-]+)(=)(&quot;[^&]*&quot;|"[^"]*")/g, '<span style="color:var(--attr)">$1</span><span style="color:var(--text-muted)">$2</span><span style="color:var(--string)">$3</span>')
    .replace(/(&gt;|&lt;\/[\w-]+&gt;)/g, '<span style="color:var(--keyword)">$1</span>');
}

function highlightCSS(code) {
  return escHtml(code)
    .replace(/(\/\*[\s\S]*?\*\/)/g, '<span style="color:var(--comment)">$1</span>')
    .replace(/(@[\w-]+)/g, '<span style="color:var(--at-rule)">$1</span>')
    .replace(/([.#]?[\w-]+)\s*\{/g, '<span style="color:var(--selector)">$1</span>{')
    .replace(/([\w-]+)\s*:/g, '<span style="color:var(--property)">$1</span>:')
    .replace(/:\s*([^;{}\n]+)/g, (m, v) => ': <span style="color:var(--value)">' + v + '</span>')
    .replace(/(\d+\.?\d*)(px|em|rem|vh|vw|%|deg|s|ms)?/g, '<span style="color:var(--number)">$1$2</span>')
    .replace(/(#[0-9a-fA-F]{3,8})/g, (m) => `<span style="color:var(--number);text-decoration:underline;text-decoration-color:${m}">${m}</span>`);
}

function highlightJS(code) {
  const keywords = /\b(const|let|var|function|return|if|else|for|while|do|switch|case|break|continue|new|this|class|extends|import|export|default|typeof|instanceof|null|undefined|true|false|async|await|try|catch|finally|throw|of|in|delete|void)\b/g;
  return escHtml(code)
    .replace(/(\/\/[^\n]*)/g, '<span style="color:var(--comment)">$1</span>')
    .replace(/(\/\*[\s\S]*?\*\/)/g, '<span style="color:var(--comment)">$1</span>')
    .replace(/(`[^`]*`)/g, '<span style="color:var(--string)">$1</span>')
    .replace(/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/g, '<span style="color:var(--string)">$1</span>')
    .replace(keywords, '<span style="color:var(--keyword)">$1</span>')
    .replace(/\b(\d+\.?\d*)\b/g, '<span style="color:var(--number)">$1</span>')
    .replace(/\b([\w$]+)\s*\(/g, '<span style="color:var(--function)">$1</span>(');
}

let acSelected = -1;
let acItems = [];
let acVisible = false;

function showAutocomplete() {
  const input = codeInput();
  const file = state.files[state.activeFile];
  if (!file) return;
  const lang = file.language;
  const pos = input.selectionStart;
  const text = input.value.substring(0, pos);
  const word = text.match(/[\w@.-]*$/)?.[0] || '';
  if (word.length < 1) { hideAutocomplete(); return; }

  const list = completions[lang] || [];
  acItems = list.filter(c => c.label.startsWith(word) || c.label.includes(word));
  if (!acItems.length) { hideAutocomplete(); return; }

  const ac = document.getElementById('autocomplete');
  ac.innerHTML = acItems.map((c,i) => `
    <div class="ac-item${i===acSelected?' selected':''}" onclick="applyCompletion(${i})">
      <span class="ac-kind ac-kind-${c.kind}">${c.kind.substring(0,3)}</span>
      <span class="ac-label">${c.label}</span>
    </div>`).join('');

  // Position
  const coords = getCaretCoords(input, pos);
  const wrap = document.getElementById('code-wrap');
  const rect = wrap.getBoundingClientRect();
  ac.style.left = (rect.left + coords.left - input.scrollLeft + 10) + 'px';
  ac.style.top = (rect.top + coords.top - input.scrollTop + 20) + 'px';
  ac.style.display = 'block';
  acVisible = true;
}

function hideAutocomplete() {
  document.getElementById('autocomplete').style.display = 'none';
  acVisible = false;
  acSelected = -1;
}

function applyCompletion(idx) {
  const input = codeInput();
  const pos = input.selectionStart;
  const text = input.value;
  const before = text.substring(0, pos);
  const word = before.match(/[\w@.-]*$/)?.[0] || '';
  const start = pos - word.length;
  const item = acItems[idx];
  const newText = text.substring(0, start) + item.insert + text.substring(pos);
  input.value = newText;
  const newPos = start + item.insert.length;
  input.setSelectionRange(newPos, newPos);
  saveCurrentFile();
  highlightCode();
  updateLineNumbers();
  hideAutocomplete();
}

function getCaretCoords(textarea, pos) {
  const div = document.createElement('div');
  const style = getComputedStyle(textarea);
  ['fontFamily','fontSize','lineHeight','padding','border','boxSizing','whiteSpace','wordWrap','overflowWrap','letterSpacing'].forEach(p => div.style[p] = style[p]);
  div.style.position = 'absolute';
  div.style.visibility = 'hidden';
  div.style.whiteSpace = 'pre-wrap';
  document.body.appendChild(div);
  const text = textarea.value.substring(0, pos);
  div.textContent = text;
  const span = document.createElement('span');
  span.textContent = '|';
  div.appendChild(span);
  const coords = { left: span.offsetLeft, top: span.offsetTop };
  document.body.removeChild(div);
  return coords;
}

// ════════════════════════════════════════════════════════
// EDITOR INPUT HANDLING
// ════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  const input = codeInput();

  input.addEventListener('input', () => {
    saveCurrentFile();
    highlightCode();
    updateLineNumbers();
    showAutocomplete();
    refreshPreviewAuto();
  });

  input.addEventListener('scroll', syncScroll);

  input.addEventListener('keydown', (e) => {
    if (acVisible) {
      if (e.key === 'ArrowDown') { e.preventDefault(); acSelected = Math.min(acSelected+1, acItems.length-1); renderAcSelected(); return; }
      if (e.key === 'ArrowUp') { e.preventDefault(); acSelected = Math.max(acSelected-1, 0); renderAcSelected(); return; }
      if (e.key === 'Enter' || e.key === 'Tab') { if(acSelected>=0){e.preventDefault();applyCompletion(acSelected);return;} hideAutocomplete(); }
      if (e.key === 'Escape') { hideAutocomplete(); return; }
    }

    // Tab = 2 spaces
    if (e.key === 'Tab') {
      e.preventDefault();
      const pos = input.selectionStart;
      const end = input.selectionEnd;
      if (pos === end) {
        input.value = input.value.substring(0, pos) + '  ' + input.value.substring(end);
        input.setSelectionRange(pos+2, pos+2);
      } else {
        // Indent selection
        const lines = input.value.substring(pos, end).split('\n');
        const indented = lines.map(l => '  ' + l).join('\n');
        input.value = input.value.substring(0, pos) + indented + input.value.substring(end);
      }
      saveCurrentFile(); highlightCode(); updateLineNumbers();
    }

    // Auto-close brackets
    const pairs = { '(':')', '[':']', '{':'}', '"':'"', "'":"'", '`':'`' };
    if (pairs[e.key]) {
      e.preventDefault();
      const pos = input.selectionStart;
      input.value = input.value.substring(0, pos) + e.key + pairs[e.key] + input.value.substring(pos);
      input.setSelectionRange(pos+1, pos+1);
      saveCurrentFile(); highlightCode(); updateLineNumbers();
    }

    // Ctrl+S
    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); refreshPreview(); }
    // Ctrl+/ comment
    if ((e.ctrlKey || e.metaKey) && e.key === '/') { e.preventDefault(); toggleComment(); }
    // Ctrl+D duplicate line
    if ((e.ctrlKey || e.metaKey) && e.key === 'd') { e.preventDefault(); duplicateLine(); }

    updateCursorPos();
  });

  input.addEventListener('click', () => { hideAutocomplete(); updateCursorPos(); });
  input.addEventListener('keyup', updateCursorPos);

  // Drag & drop on editor
  input.addEventListener('dragover', e => e.preventDefault());
  input.addEventListener('drop', e => {
    e.preventDefault();
    const files = [...e.dataTransfer.files];
    files.forEach(handleDroppedFile);
  });

  init();
});

function renderAcSelected() {
  document.querySelectorAll('.ac-item').forEach((el, i) => {
    el.className = 'ac-item' + (i === acSelected ? ' selected' : '');
  });
}

function saveCurrentFile() {
  if (!state.activeFile || !state.files[state.activeFile]) return;
  state.files[state.activeFile].content = codeInput().value;
  state.modified.add(state.activeFile);
  renderTabs();
}

function updateCursorPos() {
  const input = codeInput();
  const pos = input.selectionStart;
  const text = input.value.substring(0, pos);
  const lines = text.split('\n');
  const ln = lines.length;
  const col = lines[lines.length - 1].length + 1;
  document.getElementById('status-pos').textContent = `Ln ${ln}, Col ${col}`;
}

function updateStatusBar() {
  const file = state.files[state.activeFile];
  if (file) document.getElementById('status-lang').textContent = file.language;
}

function toggleComment() {
  const input = codeInput();
  const file = state.files[state.activeFile];
  const pos = input.selectionStart;
  const lines = input.value.split('\n');
  let charCount = 0;
  let lineIdx = 0;
  for (let i = 0; i < lines.length; i++) {
    if (charCount + lines[i].length >= pos) { lineIdx = i; break; }
    charCount += lines[i].length + 1;
  }
  const prefix = file.language === 'CSS' ? '/* ' : '// ';
  const suffix = file.language === 'CSS' ? ' */' : '';
  if (lines[lineIdx].trimStart().startsWith(prefix.trim())) {
    lines[lineIdx] = lines[lineIdx].replace(prefix, '').replace(suffix, '');
  } else {
    lines[lineIdx] = prefix + lines[lineIdx] + suffix;
  }
  input.value = lines.join('\n');
  saveCurrentFile(); highlightCode(); updateLineNumbers();
}

function duplicateLine() {
  const input = codeInput();
  const pos = input.selectionStart;
  const lines = input.value.split('\n');
  let charCount = 0, lineIdx = 0;
  for (let i = 0; i < lines.length; i++) {
    if (charCount + lines[i].length >= pos) { lineIdx = i; break; }
    charCount += lines[i].length + 1;
  }
  lines.splice(lineIdx + 1, 0, lines[lineIdx]);
  input.value = lines.join('\n');
  saveCurrentFile(); highlightCode(); updateLineNumbers();
}

let previewTimeout;
function refreshPreviewAuto() {
  clearTimeout(previewTimeout);
  previewTimeout = setTimeout(() => { if (state.previewOpen) refreshPreview(); }, 500);
}

function refreshPreview() {
  const htmlFile = Object.keys(state.files).find(p => p.endsWith('.html'));
  if (!htmlFile) return;
  let html = state.files[htmlFile].content;

  // Inject CSS files
  Object.entries(state.files).forEach(([path, f]) => {
    if (path.endsWith('.css')) {
      const name = path.split('/').pop();
      html = html.replace(new RegExp(`href=["']${name}["']`), `href="data:text/css,${encodeURIComponent(f.content)}"`);
    }
  });

  // Inject JS files
  Object.entries(state.files).forEach(([path, f]) => {
    if (path.endsWith('.js')) {
      const name = path.split('/').pop();
      html = html.replace(new RegExp(`src=["']${name}["']`), `src="data:text/javascript,${encodeURIComponent(f.content)}"`);
    }
  });

  // Inject images
  Object.entries(state.images).forEach(([name, dataUrl]) => {
    html = html.replace(new RegExp(`src=["']${name}["']`, 'g'), `src="${dataUrl}"`);
    html = html.replace(new RegExp(`url\\(['"]?${name}['"]?\\)`, 'g'), `url(${dataUrl})`);
  });

  const frame = document.getElementById('preview-frame');
  frame.srcdoc = html;
  state.modified.delete(htmlFile);
  renderTabs();
}

function togglePreview() {
  state.previewOpen = !state.previewOpen;
  document.getElementById('preview-panel').classList.toggle('open', state.previewOpen);
  if (state.previewOpen) refreshPreview();
}

function showNewFolderModal(parent='') {
  modalMode = 'folder';
  modalContext = parent;
  document.getElementById('modal-title').textContent = 'Nova Pasta';
  document.getElementById('modal-input').value = '';
  document.getElementById('modal-input').placeholder = 'components';
  document.getElementById('modal-overlay').style.display = 'flex';
  setTimeout(() => document.getElementById('modal-input').focus(), 50);
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').style.display = 'none';
}

function modalConfirm() {
  const val = document.getElementById('modal-input').value.trim();
  if (!val) return;
  if (modalMode === 'file') {
    const base = modalContext || '';
    const path = base ? `${base}/${val}` : `/${val}`;
    if (!state.files[path]) {
      const templates = { html: defaultHTML(val), css: defaultCSS(val), js: defaultJS(val) };
      const ext = val.split('.').pop();
      createFile(path, templates[ext] || '');
    }
    document.getElementById('modal-overlay').style.display = 'none';
    openFile(path);
    renderFileTree();
  } else if (modalMode === 'folder') {
    const base = modalContext || '';
    const path = base ? `${base}/${val}` : `/${val}`;
    state.folders.add(path);
    state.expandedFolders.add(path);
    document.getElementById('modal-overlay').style.display = 'none';
    renderFileTree();
  } else if (modalMode === 'rename') {
    const oldPath = modalContext;
    const dir = oldPath.substring(0, oldPath.lastIndexOf('/'));
    const newPath = dir + '/' + val;
    if (newPath !== oldPath) {
      state.files[newPath] = state.files[oldPath];
      delete state.files[oldPath];
      const tabIdx = state.openTabs.indexOf(oldPath);
      if (tabIdx >= 0) state.openTabs[tabIdx] = newPath;
      if (state.activeFile === oldPath) { state.activeFile = newPath; loadFileInEditor(newPath); }
    }
    document.getElementById('modal-overlay').style.display = 'none';
    renderFileTree(); renderTabs();
  }
}

function defaultHTML(name) {
  return `<!DOCTYPE html>\n<html lang="pt-BR">\n<head>\n  <meta charset="UTF-8">\n  <title>${name.replace('.html','')}</title>\n</head>\n<body>\n  \n</body>\n</html>`;
}
function defaultCSS() { return `/* Estilos */\n\nbody {\n  margin: 0;\n  font-family: system-ui, sans-serif;\n}\n`; }
function defaultJS() { return `// JavaScript\n\nconsole.log('Pronto!');\n`; }

function deleteFile(path) {
  if (!confirm(`Excluir "${path.split('/').pop()}"?`)) return;
  delete state.files[path];
  const idx = state.openTabs.indexOf(path);
  if (idx >= 0) state.openTabs.splice(idx, 1);
  if (state.activeFile === path) { state.activeFile = state.openTabs[0] || null; if (state.activeFile) loadFileInEditor(state.activeFile); else showWelcome(); }
  renderFileTree(); renderTabs();
}

function deleteFolder(path) {
  if (!confirm(`Excluir pasta "${path}" e todo seu conteúdo?`)) return;
  state.folders.delete(path);
  state.expandedFolders.delete(path);
  Object.keys(state.files).filter(p => p.startsWith(path + '/')).forEach(p => { delete state.files[p]; const idx = state.openTabs.indexOf(p); if (idx>=0) state.openTabs.splice(idx,1); });
  renderFileTree(); renderTabs();
}

function renameFilePrompt(path) {
  modalMode = 'rename';
  modalContext = path;
  document.getElementById('modal-title').textContent = 'Renomear';
  document.getElementById('modal-input').value = path.split('/').pop();
  document.getElementById('modal-overlay').style.display = 'flex';
  setTimeout(() => document.getElementById('modal-input').select(), 50);
}

function handleImport(e) {
  const files = [...e.target.files];
  files.forEach(handleDroppedFile);
  e.target.value = '';
}

function handleFolderImport(e) {
  const files = [...e.target.files];
  files.forEach(f => {
    const path = '/' + f.webkitRelativePath;
    const isImage = /\.(png|jpg|jpeg|gif|svg|webp)$/i.test(f.name);
    if (isImage) {
      const reader = new FileReader();
      reader.onload = ev => { state.images[f.name] = ev.target.result; renderFileTree(); };
      reader.readAsDataURL(f);
    } else if (/\.(html|css|js)$/i.test(f.name)) {
      const reader = new FileReader();
      reader.onload = ev => { createFile(path, ev.target.result); renderFileTree(); };
      reader.readAsText(f);
    }
  });
  e.target.value = '';
}

function handleDroppedFile(file) {
  const isImage = /\.(png|jpg|jpeg|gif|svg|webp)$/i.test(file.name);
  if (isImage) {
    const reader = new FileReader();
    reader.onload = e => { state.images[file.name] = e.target.result; logConsole(`Imagem "${file.name}" importada!`, 'info'); renderFileTree(); };
    reader.readAsDataURL(file);
  } else if (/\.(html|css|js)$/i.test(file.name)) {
    const reader = new FileReader();
    reader.onload = e => { createFile('/' + file.name, e.target.result); openFile('/' + file.name); renderFileTree(); logConsole(`Arquivo "${file.name}" importado!`, 'info'); };
    reader.readAsText(file);
  }
}

// ════════════════════════════════════════════════════════
// EXPORT ZIP
// ════════════════════════════════════════════════════════
async function exportZip() {
  // Simple ZIP implementation
  logConsole('Gerando ZIP...', 'info');
  
  const zipParts = [];
  const centralDir = [];
  let offset = 0;

  async function addFile(name, content) {
    const encoder = new TextEncoder();
    const data = typeof content === 'string' ? encoder.encode(content) : content;
    const nameBytes = encoder.encode(name);
    const crc = crc32(data);
    
    // Local file header
    const header = new Uint8Array(30 + nameBytes.length);
    const view = new DataView(header.buffer);
    view.setUint32(0, 0x04034b50, true); // signature
    view.setUint16(4, 20, true); // version needed
    view.setUint16(6, 0, true); // flags
    view.setUint16(8, 0, true); // compression (stored)
    view.setUint16(10, 0, true); // mod time
    view.setUint16(12, 0, true); // mod date
    view.setUint32(14, crc, true);
    view.setUint32(18, data.length, true);
    view.setUint32(22, data.length, true);
    view.setUint16(26, nameBytes.length, true);
    view.setUint16(28, 0, true);
    header.set(nameBytes, 30);

    const centralEntry = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(centralEntry.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, 0, true);
    cv.setUint16(14, 0, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, data.length, true);
    cv.setUint32(24, data.length, true);
    cv.setUint16(28, nameBytes.length, true);
    cv.setUint16(30, 0, true);
    cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true);
    cv.setUint16(36, 0, true);
    cv.setUint32(38, 0, true);
    cv.setUint32(42, offset, true);
    centralEntry.set(nameBytes, 46);

    zipParts.push(header, data);
    centralDir.push(centralEntry);
    offset += header.length + data.length;
  }

  // Add all files
  for (const [path, file] of Object.entries(state.files)) {
    await addFile(path.replace(/^\//, ''), file.content);
  }

  // Add images
  for (const [name, dataUrl] of Object.entries(state.images)) {
    const base64 = dataUrl.split(',')[1];
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    await addFile(`images/${name}`, bytes);
  }

  // End of central directory
  const cdSize = centralDir.reduce((s, d) => s + d.length, 0);
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(4, 0, true);
  ev.setUint16(6, 0, true);
  ev.setUint16(8, centralDir.length, true);
  ev.setUint16(10, centralDir.length, true);
  ev.setUint32(12, cdSize, true);
  ev.setUint32(16, offset, true);
  ev.setUint16(20, 0, true);

  const allParts = [...zipParts, ...centralDir, eocd];
  const totalSize = allParts.reduce((s, p) => s + p.length, 0);
  const zip = new Uint8Array(totalSize);
  let pos = 0;
  allParts.forEach(p => { zip.set(p, pos); pos += p.length; });

  const blob = new Blob([zip], { type: 'application/zip' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'meu-site.zip';
  a.click();
  URL.revokeObjectURL(url);
  logConsole('ZIP exportado com sucesso!', 'info');
}

function crc32(data) {
  const table = crc32.table || (crc32.table = (() => {
    const t = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      let c = i;
      for (let j = 0; j < 8; j++) c = (c & 1) ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
      t[i] = c;
    }
    return t;
  })());
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < data.length; i++) crc = table[(crc ^ data[i]) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

    <div style="padding:8px 12px 4px;font-size:11px;color:var(--text-muted);">${imgs.length} imagem(s)</div>
    <div class="icon-btn" style="margin:4px 8px;display:flex;gap:6px;align-items:center;cursor:pointer;color:var(--accent);font-size:12px;" onclick="importImageClick()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Adicionar Imagem
    </div>
    <div id="images-panel">
      ${imgs.map(([name, url]) => `
        <div class="img-thumb" title="${name}" onclick="insertImageRef('${name}')">
          <img src="${url}" alt="${name}">
          <div class="img-name">${name}</div>
        </div>`).join('')}
      ${!imgs.length ? '<div style="padding:12px;color:var(--text-muted);font-size:12px;">Nenhuma imagem. Clique acima ou arraste para o editor.</div>' : ''}
    </div>`;
}

function importImageClick() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.multiple = true;
  inp.onchange = e => [...e.target.files].forEach(f => {
    const reader = new FileReader();
    reader.onload = ev => { state.images[f.name] = ev.target.result; renderFileTree(); logConsole(`Imagem "${f.name}" adicionada`, 'info'); };
    reader.readAsDataURL(f);
  });
  inp.click();
}

function insertImageRef(name) {
  if (!state.activeFile) { alert('Abra um arquivo para inserir a referência da imagem.'); return; }
  const file = state.files[state.activeFile];
  const input = codeInput();
  const pos = input.selectionStart;
  let snippet = '';
  if (file.language === 'HTML') snippet = `<img src="${name}" alt="${name.split('.')[0]}">`;
  else if (file.language === 'CSS') snippet = `background-image: url('${name}');`;
  else snippet = `'${name}'`;
  input.value = input.value.substring(0, pos) + snippet + input.value.substring(pos);
  input.setSelectionRange(pos + snippet.length, pos + snippet.length);
  saveCurrentFile(); highlightCode(); updateLineNumbers();
  logConsole(`Referência de imagem "${name}" inserida`, 'info');
}

function renderSearchPanel() {
  const tree = document.getElementById('file-tree');
  tree.innerHTML = `
    <div style="padding:8px;">
      <input id="search-input" type="text" placeholder="Buscar no projeto..." style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:7px 10px;color:var(--text);font-family:JetBrains Mono,monospace;font-size:12px;outline:none;" oninput="doSearch(this.value)">
    </div>
    <div id="search-results" style="padding:4px 8px;font-size:12px;"></div>`;
}

function doSearch(query) {
  const results = document.getElementById('search-results');
  if (!query) { results.innerHTML = ''; return; }
  const found = [];
  Object.entries(state.files).forEach(([path, f]) => {
    const lines = f.content.split('\n');
    lines.forEach((line, i) => {
      if (line.toLowerCase().includes(query.toLowerCase())) {
        found.push({ path, line: i+1, text: line.trim() });
      }
    });
  });
  if (!found.length) { results.innerHTML = '<div style="color:var(--text-muted);padding:8px 0;">Nenhum resultado</div>'; return; }
  results.innerHTML = found.slice(0,30).map(r => `
    <div onclick="openFile('${r.path}')" style="padding:6px 4px;cursor:pointer;border-radius:4px;transition:background .1s;" onmouseover="this.style.background='var(--hover)'" onmouseout="this.style.background=''">
      <div style="color:var(--accent);font-size:11px;">${r.path} <span style="color:var(--text-muted)">:${r.line}</span></div>
      <div style="color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${r.text}</div>
    </div>`).join('');
}

// ════════════════════════════════════════════════════════
// THEME
// ════════════════════════════════════════════════════════
function setTheme(cls) {
  document.body.className = cls;
  document.getElementById('theme-picker').classList.remove('open');
}
function toggleThemePicker() {
  document.getElementById('theme-picker').classList.toggle('open');
}

// ════════════════════════════════════════════════════════
// CONTEXT MENU
// ════════════════════════════════════════════════════════
function showCtxMenu(e, type, path) {
  const menu = document.getElementById('ctx-menu');
  const items = type === 'file' ? [
    { label:'Abrir', action:`openFile('${path}')` },
    { label:'Renomear', action:`renameFilePrompt('${path}')` },
    { sep: true },
    { label:'Excluir', action:`deleteFile('${path}')`, danger: true },
  ] : [
    { label:'Novo arquivo aqui', action:`showNewFileModal('${path}')` },
    { label:'Nova pasta aqui', action:`showNewFolderModal('${path}')` },
    { sep: true },
    { label:'Excluir pasta', action:`deleteFolder('${path}')`, danger: true },
  ];
  menu.innerHTML = items.map(item => item.sep ? '<div class="ctx-sep"></div>' :
    `<div class="ctx-item${item.danger?' danger':''}" onclick="${item.action};hideCtxMenu()">${item.label}</div>`).join('');
  menu.style.display = 'block';
  menu.style.left = Math.min(e.clientX, window.innerWidth - 200) + 'px';
  menu.style.top = Math.min(e.clientY, window.innerHeight - 200) + 'px';
}
function hideCtxMenu() { document.getElementById('ctx-menu').style.display = 'none'; }
document.addEventListener('click', hideCtxMenu);

// ════════════════════════════════════════════════════════
// CONSOLE
// ════════════════════════════════════════════════════════
function logConsole(msg, type='') {
  const out = document.getElementById('console-output');
  const bp = document.getElementById('bottom-panel');
  bp.style.display = 'flex';
  const div = document.createElement('div');
  div.className = `console-line ${type}`;
  div.innerHTML = `<span class="console-prefix">[${new Date().toLocaleTimeString()}]</span><span>${msg}</span>`;
  out.appendChild(div);
  out.scrollTop = out.scrollHeight;
}

function switchPanel(name) {
  document.querySelectorAll('.panel-tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
}

// ════════════════════════════════════════════════════════
// DRAG RESIZE
// ════════════════════════════════════════════════════════
const dragHandle = document.getElementById('drag-handle');
let isDragging = false;
dragHandle.addEventListener('mousedown', () => isDragging = true);
document.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const sidebar = document.getElementById('sidebar');
  const rect = document.getElementById('main').getBoundingClientRect();
  const newW = Math.max(150, Math.min(400, e.clientX - rect.left - 48));
  sidebar.style.width = newW + 'px';
});
document.addEventListener('mouseup', () => isDragging = false);

// Close theme picker on outside click
document.addEventListener('click', e => {
  const tp = document.getElementById('theme-picker');
  if (!e.target.closest('.act-btn') && !tp.contains(e.target)) tp.classList.remove('open');
});

// Keyboard shortcut: Ctrl+P = preview
document.addEventListener('keydown', e => {
  if ((e.ctrlKey||e.metaKey) && e.key==='p') { e.preventDefault(); togglePreview(); }
  if ((e.ctrlKey||e.metaKey) && e.key==='n') { e.preventDefault(); showNewFileModal(); }
  if ((e.ctrlKey||e.metaKey) && e.shiftKey && e.key==='N') { e.preventDefault(); showNewFolderModal(); }
});
</script>
