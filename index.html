<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebStudio — Editor de Código</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --sidebar-bg: #161b22;
    --tab-bar: #0d1117;
    --active-tab: #1e2530;
    --border: #21262d;
    --text: #c9d1d9;
    --text-muted: #6e7681;
    --accent: #58a6ff;
    --accent2: #3fb950;
    --accent3: #d2a8ff;
    --accent4: #ffa657;
    --accent5: #f85149;
    --hover: #1f2937;
    --selection: #1f3a5f;
    --line-num: #495057;
    --status-bg: #1565c0;
    --editor-bg: #0d1117;
    --gutter: #161b22;
    --tooltip: #21262d;
    --scrollbar: #30363d;
    --keyword: #ff7b72;
    --string: #a5d6ff;
    --comment: #8b949e;
    --number: #79c0ff;
    --function: #d2a8ff;
    --tag: #7ee787;
    --attr: #79c0ff;
    --property: #79c0ff;
    --value: #a5d6ff;
    --selector: #f2cc60;
    --at-rule: #ff7b72;
    --important: #ffa657;
  }
  .theme-light {
    --bg: #f6f8fa; --sidebar-bg: #ffffff; --tab-bar: #f0f2f4; --active-tab: #ffffff;
    --border: #d0d7de; --text: #24292f; --text-muted: #656d76; --accent: #0969da;
    --hover: #eaeef2; --selection: #cae8ff; --line-num: #8c959f; --status-bg: #0969da;
    --editor-bg: #ffffff; --gutter: #f6f8fa; --scrollbar: #d0d7de;
    --keyword: #cf222e; --string: #0a3069; --comment: #6e7781; --number: #0550ae;
    --function: #8250df; --tag: #116329; --attr: #0550ae; --property: #0550ae;
    --value: #0a3069; --selector: #953800; --at-rule: #cf222e;
  }
  .theme-monokai {
    --bg: #272822; --sidebar-bg: #1e1f1c; --tab-bar: #272822; --active-tab: #3e3d32;
    --border: #3e3d32; --text: #f8f8f2; --text-muted: #75715e; --accent: #a6e22e;
    --hover: #3e3d32; --selection: #49483e; --line-num: #75715e; --status-bg: #75715e;
    --editor-bg: #272822; --gutter: #1e1f1c; --scrollbar: #49483e;
    --keyword: #f92672; --string: #e6db74; --comment: #75715e; --number: #ae81ff;
    --function: #a6e22e; --tag: #f92672; --attr: #a6e22e; --property: #66d9e8;
    --value: #e6db74; --selector: #a6e22e; --at-rule: #f92672;
  }
  .theme-dracula {
    --bg: #282a36; --sidebar-bg: #21222c; --tab-bar: #21222c; --active-tab: #282a36;
    --border: #44475a; --text: #f8f8f2; --text-muted: #6272a4; --accent: #bd93f9;
    --hover: #44475a; --selection: #44475a; --line-num: #6272a4; --status-bg: #6272a4;
    --editor-bg: #282a36; --gutter: #21222c; --scrollbar: #44475a;
    --keyword: #ff79c6; --string: #f1fa8c; --comment: #6272a4; --number: #bd93f9;
    --function: #50fa7b; --tag: #ff79c6; --attr: #50fa7b; --property: #66d9e8;
    --value: #f1fa8c; --selector: #50fa7b; --at-rule: #ff79c6;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; font-family:'JetBrains Mono',monospace; background:var(--bg); color:var(--text); font-size:13px; }

  #app { display:flex; flex-direction:column; height:100vh; }
  #titlebar { height:32px; background:var(--sidebar-bg); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 12px; gap:16px; user-select:none; flex-shrink:0; }
  #titlebar .logo { font-family:'Syne',sans-serif; font-weight:800; font-size:15px; color:var(--accent); letter-spacing:-0.5px; }
  #titlebar .menus { display:flex; gap:2px; }
  .menu-btn { padding:2px 10px; border-radius:4px; cursor:pointer; color:var(--text-muted); font-size:12px; font-family:'Syne',sans-serif; transition:all .15s; }
  .menu-btn:hover { background:var(--hover); color:var(--text); }

  #main { display:flex; flex:1; overflow:hidden; }

  #actbar { width:48px; background:var(--sidebar-bg); border-right:1px solid var(--border); display:flex; flex-direction:column; align-items:center; padding:8px 0; gap:4px; flex-shrink:0; }
  .act-btn { width:36px; height:36px; border-radius:8px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-muted); transition:all .15s; }
  .act-btn:hover, .act-btn.active { color:var(--text); background:var(--hover); }
  .act-btn.active { color:var(--accent); }
  .act-btn svg { width:20px; height:20px; }

  #sidebar { width:240px; background:var(--sidebar-bg); border-right:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; overflow:hidden; transition:width .2s; }
  #sidebar.collapsed { width:0; }
  #sidebar-header { padding:10px 12px 6px; font-size:10px; font-weight:700; color:var(--text-muted); letter-spacing:1.5px; text-transform:uppercase; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); flex-shrink:0; }
  #sidebar-header .actions { display:flex; gap:2px; }
  .icon-btn { width:22px; height:22px; border-radius:4px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-muted); transition:all .15s; }
  .icon-btn:hover { background:var(--hover); color:var(--text); }
  .icon-btn svg { width:14px; height:14px; }
  #file-tree { flex:1; overflow-y:auto; padding:4px 0; }
  .tree-item { display:flex; align-items:center; gap:6px; padding:3px 8px; cursor:pointer; border-radius:4px; margin:1px 4px; transition:background .1s; white-space:nowrap; overflow:hidden; font-size:12.5px; }
  .tree-item:hover { background:var(--hover); }
  .tree-item.active { background:var(--selection); color:var(--accent); }
  .tree-item.folder { color:var(--accent); }
  .tree-item .item-icon { width:16px; height:16px; flex-shrink:0; }
  .tree-item .item-name { flex:1; overflow:hidden; text-overflow:ellipsis; }
  .tree-item .item-actions { display:none; gap:2px; }
  .tree-item:hover .item-actions { display:flex; }

  #editor-area { flex:1; display:flex; flex-direction:column; overflow:hidden; }
  #tab-bar { height:35px; background:var(--tab-bar); border-bottom:1px solid var(--border); display:flex; align-items:flex-end; overflow-x:auto; flex-shrink:0; }
  #tab-bar::-webkit-scrollbar { height:3px; }
  #tab-bar::-webkit-scrollbar-thumb { background:var(--scrollbar); border-radius:2px; }
  .tab { display:flex; align-items:center; gap:8px; padding:0 14px 0 12px; height:33px; background:var(--tab-bar); border-right:1px solid var(--border); cursor:pointer; color:var(--text-muted); font-size:12px; white-space:nowrap; flex-shrink:0; transition:all .15s; }
  .tab.active { background:var(--active-tab); color:var(--text); border-top:2px solid var(--accent); }
  .tab .tab-close { width:16px; height:16px; border-radius:3px; display:flex; align-items:center; justify-content:center; opacity:0; transition:all .15s; }
  .tab:hover .tab-close, .tab.active .tab-close { opacity:1; }
  .tab .tab-close:hover { background:var(--hover); color:var(--accent5); }
  .tab .tab-close svg { width:10px; height:10px; }
  .tab .modified { width:8px; height:8px; border-radius:50%; background:var(--accent4); flex-shrink:0; }

  #editor-wrapper { flex:1; display:flex; overflow:hidden; position:relative; }
  #editor-container { flex:1; display:flex; overflow:hidden; background:var(--editor-bg); position:relative; }

  #welcome { display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; gap:12px; color:var(--text-muted); }
  #welcome .big { font-family:'Syne',sans-serif; font-size:28px; font-weight:800; color:var(--text); }
  #welcome .sub { font-size:13px; }

  /* Code editor layout */
  #code-area { display:none; flex:1; overflow:hidden; }
  #line-numbers {
    padding:12px 0;
    background:var(--gutter);
    border-right:1px solid var(--border);
    min-width:52px;
    text-align:right;
    color:var(--line-num);
    font-size:13px;
    line-height:1.6;
    user-select:none;
    flex-shrink:0;
    overflow:hidden;
  }
  #line-numbers span { display:block; padding:0 12px 0 8px; }

  /* The overlay editor trick */
  #code-wrap { flex:1; position:relative; overflow:auto; }
  #code-wrap::-webkit-scrollbar { width:10px; height:10px; }
  #code-wrap::-webkit-scrollbar-track { background:var(--editor-bg); }
  #code-wrap::-webkit-scrollbar-thumb { background:var(--scrollbar); border-radius:5px; border:2px solid var(--editor-bg); }

  #code-display {
    position:absolute;
    top:0; left:0;
    padding:12px 16px;
    font-size:13px;
    line-height:1.6;
    white-space:pre;
    pointer-events:none;
    font-family:'JetBrains Mono',monospace;
    min-width:100%;
    min-height:100%;
    tab-size:2;
  }
  #code-input {
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    padding:12px 16px;
    font-size:13px;
    line-height:1.6;
    white-space:pre;
    background:transparent;
    border:none;
    outline:none;
    resize:none;
    color:transparent;
    caret-color:var(--text);
    font-family:'JetBrains Mono',monospace;
    tab-size:2;
    overflow:hidden;
    min-width:100%;
    min-height:100%;
  }
  #code-input::selection { background:var(--selection); }

  /* Syntax token colors */
  .tok-keyword { color:var(--keyword); }
  .tok-string  { color:var(--string); }
  .tok-comment { color:var(--comment); font-style:italic; }
  .tok-number  { color:var(--number); }
  .tok-func    { color:var(--function); }
  .tok-tag     { color:var(--tag); }
  .tok-attr    { color:var(--attr); }
  .tok-sel     { color:var(--selector); }
  .tok-atrule  { color:var(--at-rule); }
  .tok-prop    { color:var(--property); }
  .tok-val     { color:var(--value); }
  .tok-punct   { color:var(--text-muted); }

  /* Autocomplete */
  #autocomplete { position:fixed; background:var(--tooltip); border:1px solid var(--border); border-radius:6px; z-index:100; min-width:240px; max-height:200px; overflow-y:auto; box-shadow:0 8px 24px rgba(0,0,0,.4); display:none; }
  .ac-item { padding:6px 12px; cursor:pointer; display:flex; align-items:center; gap:10px; transition:background .1s; }
  .ac-item:hover, .ac-item.selected { background:var(--hover); }
  .ac-item .ac-kind { font-size:10px; padding:2px 5px; border-radius:3px; font-weight:600; flex-shrink:0; }
  .ac-kind-keyword { background:#ff7b7222; color:var(--keyword); }
  .ac-kind-snippet { background:#a5d6ff22; color:var(--string); }
  .ac-kind-property { background:#79c0ff22; color:var(--property); }
  .ac-kind-function { background:#d2a8ff22; color:var(--function); }
  .ac-kind-tag { background:#7ee78722; color:var(--tag); }
  .ac-item .ac-label { flex:1; font-size:12px; }

  /* Bottom panel */
  #bottom-panel { height:160px; background:var(--sidebar-bg); border-top:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; }
  #panel-tabs { display:flex; border-bottom:1px solid var(--border); height:28px; align-items:flex-end; }
  .panel-tab { padding:0 16px; height:26px; display:flex; align-items:center; font-size:11px; color:var(--text-muted); cursor:pointer; transition:all .15s; }
  .panel-tab.active { color:var(--text); border-bottom:2px solid var(--accent); }
  #panel-content { flex:1; overflow:auto; padding:8px 12px; font-size:12px; }
  #panel-content::-webkit-scrollbar { width:6px; }
  #panel-content::-webkit-scrollbar-thumb { background:var(--scrollbar); border-radius:3px; }
  #console-output { line-height:1.8; }
  .console-line { display:flex; gap:8px; padding:1px 0; }
  .console-line.error { color:var(--accent5); }
  .console-line.warn { color:var(--accent4); }
  .console-line.info { color:var(--accent); }
  .console-prefix { color:var(--text-muted); font-size:10px; padding-top:2px; }

  /* Status Bar */
  #statusbar { height:22px; background:var(--status-bg); display:flex; align-items:center; padding:0 12px; gap:16px; font-size:11px; flex-shrink:0; }
  .status-item { display:flex; align-items:center; gap:4px; color:rgba(255,255,255,.85); cursor:pointer; padding:0 4px; border-radius:3px; }
  .status-item:hover { background:rgba(255,255,255,.15); }
  .status-sep { color:rgba(255,255,255,.3); }
  #statusbar .spacer { flex:1; }

  /* Preview */
  #preview-panel { width:0; background:var(--bg); border-left:1px solid var(--border); overflow:hidden; transition:width .2s; display:flex; flex-direction:column; flex-shrink:0; }
  #preview-panel.open { width:45%; }
  #preview-header { height:35px; background:var(--tab-bar); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 12px; gap:8px; flex-shrink:0; }
  #preview-header .title { font-size:11px; color:var(--text-muted); font-family:'Syne',sans-serif; flex:1; }
  #preview-frame { flex:1; border:none; background:white; }

  /* Modals */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:1000; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
  .modal { background:var(--sidebar-bg); border:1px solid var(--border); border-radius:10px; padding:24px; min-width:360px; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  .modal h3 { font-family:'Syne',sans-serif; font-weight:700; margin-bottom:16px; color:var(--text); }
  .modal input { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:8px 12px; color:var(--text); font-family:'JetBrains Mono',monospace; font-size:13px; outline:none; transition:border .15s; }
  .modal input:focus { border-color:var(--accent); }
  .modal .modal-actions { display:flex; gap:8px; margin-top:16px; justify-content:flex-end; }
  .btn { padding:7px 16px; border-radius:6px; border:none; cursor:pointer; font-family:'Syne',sans-serif; font-weight:600; font-size:12px; transition:all .15s; }
  .btn-primary { background:var(--accent); color:#fff; }
  .btn-primary:hover { filter:brightness(1.15); }
  .btn-ghost { background:transparent; color:var(--text-muted); border:1px solid var(--border); }
  .btn-ghost:hover { background:var(--hover); color:var(--text); }

  /* Theme picker */
  #theme-picker { position:fixed; right:12px; bottom:30px; background:var(--tooltip); border:1px solid var(--border); border-radius:8px; padding:8px; z-index:200; box-shadow:0 8px 24px rgba(0,0,0,.4); display:none; }
  #theme-picker.open { display:block; }
  .theme-option { padding:7px 14px; border-radius:5px; cursor:pointer; font-size:12px; transition:background .1s; display:flex; align-items:center; gap:8px; }
  .theme-option:hover { background:var(--hover); }
  .theme-dot { width:10px; height:10px; border-radius:50%; }

  /* Drag resize */
  #drag-handle { width:4px; background:transparent; cursor:col-resize; flex-shrink:0; transition:background .15s; }
  #drag-handle:hover { background:var(--accent); }

  /* Context menu */
  #ctx-menu { position:fixed; background:var(--tooltip); border:1px solid var(--border); border-radius:7px; z-index:500; min-width:180px; padding:4px; box-shadow:0 8px 24px rgba(0,0,0,.4); display:none; }
  .ctx-item { padding:6px 12px; border-radius:4px; cursor:pointer; font-size:12px; transition:background .1s; display:flex; align-items:center; gap:8px; }
  .ctx-item:hover { background:var(--hover); }
  .ctx-item.danger { color:var(--accent5); }
  .ctx-sep { height:1px; background:var(--border); margin:4px 0; }

  /* Images */
  #images-panel { padding:8px; display:flex; flex-wrap:wrap; gap:8px; }
  .img-thumb { width:80px; border-radius:6px; border:2px solid var(--border); cursor:pointer; transition:border .15s; }
  .img-thumb:hover { border-color:var(--accent); }
  .img-thumb img { width:100%; height:60px; object-fit:cover; border-radius:4px; display:block; }
  .img-thumb .img-name { font-size:10px; color:var(--text-muted); text-align:center; padding:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  *::-webkit-scrollbar { width:6px; height:6px; }
  *::-webkit-scrollbar-track { background:transparent; }
  *::-webkit-scrollbar-thumb { background:var(--scrollbar); border-radius:3px; }
</style>
</head>
<body>

<div id="app">
  <div id="titlebar">
    <span class="logo">⬡ WebStudio</span>
    <div class="menus">
      <span class="menu-btn" onclick="showNewFileModal()">Arquivo</span>
      <span class="menu-btn">Editar</span>
      <span class="menu-btn" onclick="togglePreview()">Preview</span>
      <span class="menu-btn" onclick="exportZip()">Exportar ZIP</span>
      <span class="menu-btn" onclick="importFiles()">Importar</span>
    </div>
  </div>

  <div id="main">
    <!-- Activity Bar -->
    <div id="actbar">
      <div class="act-btn active" id="act-explorer" title="Explorer" onclick="setActivity('explorer')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3h8l2 2h8v16H3z"/></svg>
      </div>
      <div class="act-btn" id="act-images" title="Imagens" onclick="setActivity('images')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
      </div>
      <div class="act-btn" id="act-search" title="Buscar" onclick="setActivity('search')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      </div>
      <div style="flex:1"></div>
      <div class="act-btn" title="Tema" onclick="toggleThemePicker()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </div>
    </div>

    <!-- Sidebar -->
    <div id="sidebar">
      <div id="sidebar-header">
        <span id="sidebar-title">EXPLORER</span>
        <div class="actions">
          <div class="icon-btn" title="Novo Arquivo" onclick="showNewFileModal()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
          </div>
          <div class="icon-btn" title="Nova Pasta" onclick="showNewFolderModal()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
          </div>
          <div class="icon-btn" title="Importar" onclick="importFiles()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          </div>
        </div>
      </div>
      <div id="file-tree"></div>
    </div>

    <div id="drag-handle"></div>

    <!-- Editor Area -->
    <div id="editor-area">
      <div id="tab-bar"></div>
      <div id="editor-wrapper">
        <div id="editor-container">
          <div id="welcome">
            <div class="big">WebStudio</div>
            <div class="sub">Crie ou abra um arquivo para começar</div>
            <div style="margin-top:8px;display:flex;gap:12px;">
              <span class="btn btn-primary" onclick="showNewFileModal()">Novo Arquivo</span>
              <span class="btn btn-ghost" onclick="importFiles()">Importar</span>
            </div>
          </div>
          <div id="code-area" style="display:none;flex:1;">
            <div id="line-numbers"></div>
            <div id="code-wrap">
              <div id="code-display"></div>
              <textarea id="code-input" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
            </div>
          </div>

<script>
// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
const state = {
  files: {},
  images: {},
  folders: new Set(['/']),
  activeFile: null,
  openTabs: [],
  modified: new Set(),
  previewOpen: false,
  currentActivity: 'explorer',
  expandedFolders: new Set(['/'])
};

// ══════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════
function getLanguage(filename) {
  const ext = filename.split('.').pop().toLowerCase();
  return { html:'HTML', css:'CSS', js:'JavaScript' }[ext] || 'Text';
}

function getFileIcon(filename) {
  const ext = filename.split('.').pop().toLowerCase();
  const colors = { html:'#e34c26', css:'#264de4', js:'#f0db4f' };
  const c = colors[ext] || '#8b949e';
  return `<svg class="item-icon" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.8" width="16" height="16"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`;
}

// ══════════════════════════════════════════
// INIT — empty, no default files
// ══════════════════════════════════════════
function init() {
  renderFileTree();
}

function createFile(path, content='') {
  const lang = getLanguage(path.split('/').pop());
  state.files[path] = { content, language: lang };
}

// ══════════════════════════════════════════
// FILE TREE
// ══════════════════════════════════════════
function renderFileTree() {
  const tree = document.getElementById('file-tree');

  if (state.currentActivity === 'images') { renderImagesPanel(); return; }
  if (state.currentActivity === 'search') { renderSearchPanel(); return; }

  tree.innerHTML = '';

  if (!Object.keys(state.files).length && !state.folders.size) {
    tree.innerHTML = '<div style="padding:16px 12px;color:var(--text-muted);font-size:12px;">Nenhum arquivo ainda.<br>Clique em + para criar.</div>';
    return;
  }

  // Build tree structure
  const structure = {};
  Object.keys(state.files).forEach(p => {
    const parts = p.split('/').filter(Boolean);
    let cur = structure;
    parts.forEach((part, i) => {
      if (i === parts.length - 1) cur[part] = 'file:' + p;
      else { if (!cur[part] || typeof cur[part] === 'string') cur[part] = {}; cur = cur[part]; }
    });
  });

  function renderLevel(obj, indent, parentPath='') {
    const entries = Object.entries(obj);
    const folders = entries.filter(([,v]) => typeof v === 'object');
    const files = entries.filter(([,v]) => typeof v === 'string');
    [...folders, ...files].forEach(([name, val]) => {
      const el = document.createElement('div');
      const fullPath = parentPath + '/' + name;
      if (typeof val === 'object') {
        el.className = 'tree-item folder';
        el.style.paddingLeft = (8 + indent * 16) + 'px';
        el.innerHTML = `<svg class="item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg><span class="item-name">📁 ${name}</span>`;
        el.onclick = () => toggleFolder(fullPath);
        tree.appendChild(el);
        if (state.expandedFolders.has(fullPath)) renderLevel(val, indent + 1, fullPath);
      } else {
        const fpath = val.replace('file:', '');
        el.className = 'tree-item' + (state.activeFile === fpath ? ' active' : '');
        el.style.paddingLeft = (8 + indent * 16) + 'px';
        el.innerHTML = `${getFileIcon(name)}<span class="item-name">${name}</span><div class="item-actions"><div class="icon-btn" onclick="event.stopPropagation();renameFilePrompt('${fpath}')" title="Renomear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></div><div class="icon-btn" onclick="event.stopPropagation();deleteFile('${fpath}')" title="Excluir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg></div></div>`;
        el.onclick = () => openFile(fpath);
        el.oncontextmenu = e => { e.preventDefault(); showCtxMenu(e, 'file', fpath); };
        tree.appendChild(el);
      }
    });
  }
  renderLevel(structure, 0);
}

function toggleFolder(path) {
  if (state.expandedFolders.has(path)) state.expandedFolders.delete(path);
  else state.expandedFolders.add(path);
  renderFileTree();
}

// ══════════════════════════════════════════
// TABS
// ══════════════════════════════════════════
function openFile(path) {
  if (!state.files[path]) return;
  state.activeFile = path;
  if (!state.openTabs.includes(path)) state.openTabs.push(path);
  renderTabs();
  loadFileInEditor(path);
  renderFileTree();
}

function renderTabs() {
  const bar = document.getElementById('tab-bar');
  bar.innerHTML = '';
  state.openTabs.forEach(path => {
    const name = path.split('/').pop();
    const tab = document.createElement('div');
    tab.className = 'tab' + (state.activeFile === path ? ' active' : '');
    tab.innerHTML = `${getFileIcon(name)}<span>${name}</span>${state.modified.has(path) ? '<div class="modified"></div>' : ''}<div class="tab-close" onclick="closeTab('${path}',event)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>`;
    tab.onclick = () => openFile(path);
    bar.appendChild(tab);
  });
}

function closeTab(path, e) {
  e.stopPropagation();
  const idx = state.openTabs.indexOf(path);
  state.openTabs.splice(idx, 1);
  state.modified.delete(path);
  if (state.activeFile === path) {
    state.activeFile = state.openTabs[Math.max(0, idx - 1)] || null;
    if (state.activeFile) loadFileInEditor(state.activeFile);
    else showWelcome();
  }
  renderTabs(); renderFileTree();
}

function showWelcome() {
  document.getElementById('welcome').style.display = 'flex';
  document.getElementById('code-area').style.display = 'none';
  document.getElementById('status-lang').textContent = '—';
}

// ══════════════════════════════════════════
// EDITOR
// ══════════════════════════════════════════
function loadFileInEditor(path) {
  const file = state.files[path];
  if (!file) return;
  document.getElementById('welcome').style.display = 'none';
  document.getElementById('code-area').style.display = 'flex';
  const input = document.getElementById('code-input');
  input.value = file.content;
  updateDisplay();
  updateLineNumbers();
  updateStatusBar();
}

function updateDisplay() {
  const input = document.getElementById('code-input');
  const display = document.getElementById('code-display');
  const file = state.files[state.activeFile];
  if (!file) return;

  // Sync dimensions so overlay lines up
  const wrap = document.getElementById('code-wrap');
  const w = Math.max(input.scrollWidth, wrap.clientWidth);
  const h = Math.max(input.scrollHeight, wrap.clientHeight);
  display.style.width = w + 'px';
  display.style.height = h + 'px';
  input.style.width = w + 'px';
  input.style.height = h + 'px';

  display.innerHTML = highlight(input.value, file.language);
}

function syncScroll() {
  const input = document.getElementById('code-input');
  const display = document.getElementById('code-display');
  const ln = document.getElementById('line-numbers');
  display.style.transform = `translate(-${input.scrollLeft}px, -${input.scrollTop}px)`;
  ln.scrollTop = input.scrollTop;
}

function updateLineNumbers() {
  const input = document.getElementById('code-input');
  const lines = input.value.split('\n');
  const ln = document.getElementById('line-numbers');
  ln.innerHTML = lines.map((_,i) => `<span>${i+1}</span>`).join('');
}

// ══════════════════════════════════════════
// SYNTAX HIGHLIGHTING — proper tokeniser
// ══════════════════════════════════════════
function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function span(cls, text) {
  return `<span class="${cls}">${text}</span>`;
}

function highlight(code, lang) {
  if (lang === 'HTML') return highlightHTML(code);
  if (lang === 'CSS')  return highlightCSS(code);
  if (lang === 'JavaScript') return highlightJS(code);
  return esc(code);
}

// ── HTML Highlighter ──────────────────────
function highlightHTML(code) {
  // Tokenise character by character to avoid regex nesting issues
  let out = '';
  let i = 0;
  const n = code.length;

  while (i < n) {
    // HTML comment
    if (code.startsWith('<!--', i)) {
      const end = code.indexOf('-->', i + 4);
      const token = end === -1 ? code.slice(i) : code.slice(i, end + 3);
      out += span('tok-comment', esc(token));
      i += token.length;
      continue;
    }
    // Tag
    if (code[i] === '<') {
      // find matching >
      let j = i + 1;
      let inStr = false, strCh = '';
      while (j < n) {
        if (!inStr && (code[j] === '"' || code[j] === "'")) { inStr = true; strCh = code[j]; j++; continue; }
        if (inStr && code[j] === strCh) { inStr = false; j++; continue; }
        if (!inStr && code[j] === '>') { j++; break; }
        j++;
      }
      out += tokeniseHTMLTag(code.slice(i, j));
      i = j;
      continue;
    }
    // Plain text — accumulate until next < or end
    let j = i + 1;
    while (j < n && code[j] !== '<') j++;
    out += esc(code.slice(i, j));
    i = j;
  }
  return out;
}

function tokeniseHTMLTag(raw) {
  // raw = full tag like <div class="foo"> or </div> or <!DOCTYPE html>
  let out = '';
  const isClose = raw.startsWith('</');
  const isSelfClose = raw.endsWith('/>');
  const isDOCTYPE = /^<!DOCTYPE/i.test(raw);

  if (isDOCTYPE) {
    return span('tok-keyword', esc(raw));
  }

  // Split into: < or </ , tagname, attributes, >
  const m = raw.match(/^(<\/?)([\w-]*)(.*)(\/?>\s*)$/s);
  if (!m) return span('tok-punct', esc(raw));

  out += span('tok-punct', esc(m[1]));
  if (m[2]) out += span('tok-tag', esc(m[2]));

  // Tokenise attributes
  let attrs = m[3];
  let ai = 0;
  while (ai < attrs.length) {
    // whitespace
    const ws = attrs.slice(ai).match(/^\s+/);
    if (ws) { out += esc(ws[0]); ai += ws[0].length; continue; }
    // attr=value
    const av = attrs.slice(ai).match(/^([\w-:@.]+)(\s*=\s*)(["'][^"']*["']|[\S]*)/);
    if (av) {
      out += span('tok-attr', esc(av[1]));
      out += span('tok-punct', esc(av[2]));
      out += span('tok-string', esc(av[3]));
      ai += av[0].length;
      continue;
    }
    // standalone attr
    const sa = attrs.slice(ai).match(/^[\w-:@.]+/);
    if (sa) { out += span('tok-attr', esc(sa[0])); ai += sa[0].length; continue; }
    out += esc(attrs[ai]);
    ai++;
  }

  out += span('tok-punct', esc(m[4]));
  return out;
}

// ── CSS Highlighter ───────────────────────
function highlightCSS(code) {
  // States: normal, comment, string, selector, block
  let out = '';
  let i = 0;
  const n = code.length;

  while (i < n) {
    // Comment
    if (code.startsWith('/*', i)) {
      const end = code.indexOf('*/', i + 2);
      const token = end === -1 ? code.slice(i) : code.slice(i, end + 2);
      out += span('tok-comment', esc(token));
      i += token.length;
      continue;
    }
    // String
    if (code[i] === '"' || code[i] === "'") {
      const q = code[i];
      let j = i + 1;
      while (j < n && code[j] !== q) { if (code[j] === '\\') j++; j++; }
      out += span('tok-string', esc(code.slice(i, j + 1)));
      i = j + 1;
      continue;
    }
    // @-rule
    if (code[i] === '@') {
      const m = code.slice(i).match(/^@[\w-]+/);
      if (m) { out += span('tok-atrule', esc(m[0])); i += m[0].length; continue; }
    }
    // Number + unit
    const numM = code.slice(i).match(/^-?\d+\.?\d*(px|em|rem|vh|vw|vmin|vmax|%|deg|s|ms|fr)?/);
    if (numM && numM[0].length > 0 && /\d/.test(numM[0][0])) {
      out += span('tok-number', esc(numM[0])); i += numM[0].length; continue;
    }
    // Hex color
    if (code[i] === '#') {
      const m = code.slice(i).match(/^#[0-9a-fA-F]{3,8}/);
      if (m) { out += span('tok-number', esc(m[0])); i += m[0].length; continue; }
    }
    // Property (word followed by colon inside block)
    const propM = code.slice(i).match(/^([\w-]+)(\s*:)/);
    if (propM) {
      out += span('tok-prop', esc(propM[1]));
      out += span('tok-punct', esc(propM[2]));
      i += propM[0].length;
      continue;
    }
    // Selector-like word
    const selM = code.slice(i).match(/^[.#]?[\w-]+(?=\s*[\{,])/);
    if (selM) { out += span('tok-sel', esc(selM[0])); i += selM[0].length; continue; }
    // Punctuation
    if ('{}();,'.includes(code[i])) { out += span('tok-punct', esc(code[i])); i++; continue; }
    // Default
    out += esc(code[i]);
    i++;
  }
  return out;
}

// ── JS Highlighter ────────────────────────
const JS_KEYWORDS = new Set([
  'const','let','var','function','return','if','else','for','while','do',
  'switch','case','break','continue','new','this','class','extends',
  'import','export','default','typeof','instanceof','null','undefined',
  'true','false','async','await','try','catch','finally','throw','of','in',
  'delete','void','static','get','set','yield','from','as','super'
]);

function highlightJS(code) {
  let out = '';
  let i = 0;
  const n = code.length;

  while (i < n) {
    // Line comment
    if (code.startsWith('//', i)) {
      const end = code.indexOf('\n', i);
      const token = end === -1 ? code.slice(i) : code.slice(i, end);
      out += span('tok-comment', esc(token));
      i += token.length;
      continue;
    }
    // Block comment
    if (code.startsWith('/*', i)) {
      const end = code.indexOf('*/', i + 2);
      const token = end === -1 ? code.slice(i) : code.slice(i, end + 2);
      out += span('tok-comment', esc(token));
      i += token.length;
      continue;
    }
    // Template literal
    if (code[i] === '`') {
      let j = i + 1;
      while (j < n && code[j] !== '`') { if (code[j] === '\\') j++; j++; }
      out += span('tok-string', esc(code.slice(i, j + 1)));
      i = j + 1;
      continue;
    }
    // String
    if (code[i] === '"' || code[i] === "'") {
      const q = code[i];
      let j = i + 1;
      while (j < n && code[j] !== q && code[j] !== '\n') { if (code[j] === '\\') j++; j++; }
      out += span('tok-string', esc(code.slice(i, j + 1)));
      i = j + 1;
      continue;
    }
    // Number
    const numM = code.slice(i).match(/^0x[0-9a-fA-F]+|\d+\.?\d*([eE][+-]?\d+)?/);
    if (numM && /\d/.test(code[i])) {
      out += span('tok-number', esc(numM[0])); i += numM[0].length; continue;
    }
    // Identifier or keyword
    const idM = code.slice(i).match(/^[a-zA-Z_$][\w$]*/);
    if (idM) {
      const word = idM[0];
      // Check if followed by (
      const after = code.slice(i + word.length).match(/^\s*\(/);
      if (JS_KEYWORDS.has(word)) {
        out += span('tok-keyword', esc(word));
      } else if (after) {
        out += span('tok-func', esc(word));
      } else {
        out += esc(word);
      }
      i += word.length;
      continue;
    }
    // Punctuation
    if ('(){}[];,'.includes(code[i])) { out += span('tok-punct', esc(code[i])); i++; continue; }
    // Operator
    const opM = code.slice(i).match(/^(===|!==|=>|<=|>=|&&|\|\||[+\-*/%=<>!&|^~?:])/);
    if (opM) { out += esc(opM[0]); i += opM[0].length; continue; }
    out += esc(code[i]);
    i++;
  }
  return out;
}

// ══════════════════════════════════════════

let acSelected = -1;
let acItems = [];
let acVisible = false;

function showAutocomplete() {
  const input = document.getElementById('code-input');
  const file = state.files[state.activeFile];
  if (!file) return;

  const pos = input.selectionStart;
  const text = input.value.substring(0, pos);
  const word = text.match(/[\w@!.:_-]*$/)?.[0] || '';
  if (word.length < 1) { hideAutocomplete(); return; }

  const list = completions[file.language] || [];
  acItems = list.filter(c => c.label.toLowerCase().startsWith(word.toLowerCase()) || c.label.toLowerCase().includes(word.toLowerCase()));
  if (!acItems.length) { hideAutocomplete(); return; }

  acSelected = 0;
  const ac = document.getElementById('autocomplete');
  ac.innerHTML = acItems.slice(0, 12).map((c, i) => `
    <div class="ac-item${i===0?' selected':''}" onmousedown="event.preventDefault();applyCompletion(${i})">
      <span class="ac-kind ac-kind-${c.kind}">${c.kind.slice(0,3)}</span>
      <span class="ac-label">${c.label}</span>
      ${c.desc ? `<span style="font-size:10px;color:var(--text-muted)">${c.desc}</span>` : ''}
    </div>`).join('');

  // Position near caret
  const coords = getCaretPixelPos(input);
  const acEl = ac;
  acEl.style.left = Math.min(coords.x, window.innerWidth - 260) + 'px';
  acEl.style.top = Math.min(coords.y + 20, window.innerHeight - 220) + 'px';
  acEl.style.display = 'block';
  acVisible = true;
}

function hideAutocomplete() {
  document.getElementById('autocomplete').style.display = 'none';
  acVisible = false;
  acSelected = -1;
}

function applyCompletion(idx) {
  const input = document.getElementById('code-input');
  const pos = input.selectionStart;
  const text = input.value;
  const before = text.substring(0, pos);
  const word = before.match(/[\w@!.:_-]*$/)?.[0] || '';
  const start = pos - word.length;
  const item = acItems[idx];
  const newText = text.substring(0, start) + item.insert + text.substring(pos);
  input.value = newText;
  // place cursor at end of insertion or before last char if closing tag
  const newPos = start + item.insert.length;
  input.setSelectionRange(newPos, newPos);
  saveCurrentFile();
  updateDisplay();
  updateLineNumbers();
  hideAutocomplete();
  input.focus();
}

function getCaretPixelPos(textarea) {
  const div = document.createElement('div');
  const cs = getComputedStyle(textarea);
  ['fontFamily','fontSize','lineHeight','paddingTop','paddingLeft','paddingRight','paddingBottom',
   'borderTopWidth','borderLeftWidth','boxSizing','whiteSpace','wordWrap'].forEach(p => div.style[p] = cs[p]);
  div.style.position = 'fixed';
  div.style.visibility = 'hidden';
  div.style.whiteSpace = 'pre-wrap';
  div.style.left = textarea.getBoundingClientRect().left + 'px';
  div.style.top = textarea.getBoundingClientRect().top + 'px';
  div.style.width = textarea.offsetWidth + 'px';
  document.body.appendChild(div);
  const textBefore = textarea.value.substring(0, textarea.selectionStart);
  div.textContent = textBefore;
  const span = document.createElement('span');
  span.textContent = '|';
  div.appendChild(span);
  const rect = span.getBoundingClientRect();
  document.body.removeChild(div);
  return { x: rect.left, y: rect.top };
}

function renderAcSelected() {
  document.querySelectorAll('.ac-item').forEach((el, i) => {
    el.className = 'ac-item' + (i === acSelected ? ' selected' : '');
  });
}

// ══════════════════════════════════════════
// INPUT HANDLING
// ══════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  const input = document.getElementById('code-input');

  input.addEventListener('input', () => {
    saveCurrentFile();
    updateDisplay();
    updateLineNumbers();
    showAutocomplete();
    refreshPreviewAuto();
  });

  input.addEventListener('scroll', syncScroll);

  input.addEventListener('keydown', e => {
    // ── Autocomplete navigation ──
    if (acVisible) {
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        acSelected = Math.min(acSelected + 1, Math.min(acItems.length, 12) - 1);
        renderAcSelected(); return;
      }
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        acSelected = Math.max(acSelected - 1, 0);
        renderAcSelected(); return;
      }
      if (e.key === 'Tab' || e.key === 'Enter') {
        if (acSelected >= 0) { e.preventDefault(); applyCompletion(acSelected); return; }
        hideAutocomplete();
      }
      if (e.key === 'Escape') { hideAutocomplete(); return; }
    }

    // ── ! shortcut: type ! then Enter/Tab to expand boilerplate (HTML only) ──
    // (handled by autocomplete above since ! is in the list)

    // ── Tab = 2 spaces ──
    if (e.key === 'Tab') {
      e.preventDefault();
      const pos = input.selectionStart;
      const end = input.selectionEnd;
      if (pos === end) {
        input.value = input.value.substring(0, pos) + '  ' + input.value.substring(end);
        input.setSelectionRange(pos + 2, pos + 2);
      } else {
        const lines = input.value.substring(pos, end).split('\n').map(l => '  ' + l).join('\n');
        input.value = input.value.substring(0, pos) + lines + input.value.substring(end);
      }
      saveCurrentFile(); updateDisplay(); updateLineNumbers();
    }

    // ── Auto-close brackets ──
    const pairs = { '(':')', '[':']', '{':'}' };
    if (pairs[e.key]) {
      e.preventDefault();
      const pos = input.selectionStart;
      input.value = input.value.substring(0, pos) + e.key + pairs[e.key] + input.value.substring(pos);
      input.setSelectionRange(pos + 1, pos + 1);
      saveCurrentFile(); updateDisplay(); updateLineNumbers();
    }
    // Auto-close quotes
    if (e.key === '"' || e.key === "'") {
      e.preventDefault();
      const pos = input.selectionStart;
      input.value = input.value.substring(0, pos) + e.key + e.key + input.value.substring(pos);
      input.setSelectionRange(pos + 1, pos + 1);
      saveCurrentFile(); updateDisplay(); updateLineNumbers();
    }

    // ── Ctrl+S = save/refresh preview ──
    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); refreshPreview(); }
    // ── Ctrl+/ = toggle comment ──
    if ((e.ctrlKey || e.metaKey) && e.key === '/') { e.preventDefault(); toggleComment(); }
    // ── Ctrl+D = duplicate line ──
    if ((e.ctrlKey || e.metaKey) && e.key === 'd') { e.preventDefault(); duplicateLine(); }

    updateCursorPos();
  });

  input.addEventListener('click', () => { hideAutocomplete(); updateCursorPos(); });
  input.addEventListener('keyup', updateCursorPos);

  // Drag & drop
  input.addEventListener('dragover', e => e.preventDefault());
  input.addEventListener('drop', e => {
    e.preventDefault();
    [...e.dataTransfer.files].forEach(handleDroppedFile);
  });

  init();
});

function saveCurrentFile() {
  if (!state.activeFile || !state.files[state.activeFile]) return;
  state.files[state.activeFile].content = document.getElementById('code-input').value;
  state.modified.add(state.activeFile);
  renderTabs();
}

function updateCursorPos() {
  const input = document.getElementById('code-input');
  const pos = input.selectionStart;
  const text = input.value.substring(0, pos);
  const lines = text.split('\n');
  document.getElementById('status-pos').textContent = `Ln ${lines.length}, Col ${lines[lines.length-1].length + 1}`;
}

function updateStatusBar() {
  const file = state.files[state.activeFile];
  document.getElementById('status-lang').textContent = file ? file.language : '—';
}

function toggleComment() {
  const input = document.getElementById('code-input');
  const file = state.files[state.activeFile];
  const pos = input.selectionStart;
  const lines = input.value.split('\n');
  let charCount = 0, lineIdx = 0;
  for (let i = 0; i < lines.length; i++) {
    if (charCount + lines[i].length >= pos) { lineIdx = i; break; }
    charCount += lines[i].length + 1;
  }
  const prefix = file.language === 'HTML' ? '<!-- ' : (file.language === 'CSS' ? '/* ' : '// ');
  const suffix = file.language === 'HTML' ? ' -->' : (file.language === 'CSS' ? ' */' : '');
  if (lines[lineIdx].trimStart().startsWith(prefix.trim())) {
    lines[lineIdx] = lines[lineIdx].replace(prefix, '').replace(suffix, '');
  } else {
    lines[lineIdx] = prefix + lines[lineIdx] + suffix;
  }
  input.value = lines.join('\n');
  saveCurrentFile(); updateDisplay(); updateLineNumbers();
}

function duplicateLine() {
  const input = document.getElementById('code-input');
  const pos = input.selectionStart;
  const lines = input.value.split('\n');
  let charCount = 0, lineIdx = 0;
  for (let i = 0; i < lines.length; i++) {
    if (charCount + lines[i].length >= pos) { lineIdx = i; break; }
    charCount += lines[i].length + 1;
  }
  lines.splice(lineIdx + 1, 0, lines[lineIdx]);
  input.value = lines.join('\n');
  saveCurrentFile(); updateDisplay(); updateLineNumbers();
}

let previewTimeout;
function refreshPreviewAuto() {
  clearTimeout(previewTimeout);
  previewTimeout = setTimeout(() => { if (state.previewOpen) refreshPreview(); }, 600);
}

function refreshPreview() {
  const htmlFile = Object.keys(state.files).find(p => p.endsWith('.html'));
  if (!htmlFile) { logConsole('Nenhum arquivo .html encontrado.', 'warn'); return; }
  let html = state.files[htmlFile].content;
  Object.entries(state.files).forEach(([path, f]) => {
    if (path.endsWith('.css')) {
      const name = path.split('/').pop();
      html = html.replace(new RegExp(`href=["']${name}["']`), `href="data:text/css,${encodeURIComponent(f.content)}"`);
    }
    if (path.endsWith('.js')) {
      const name = path.split('/').pop();
      html = html.replace(new RegExp(`src=["']${name}["']`), `src="data:text/javascript,${encodeURIComponent(f.content)}"`);
    }
  });
  Object.entries(state.images).forEach(([name, dataUrl]) => {
    html = html.replace(new RegExp(`src=["']${name}["']`, 'g'), `src="${dataUrl}"`);
  });
  document.getElementById('preview-frame').srcdoc = html;
  state.modified.delete(htmlFile);
  renderTabs();
}

function togglePreview() {
  state.previewOpen = !state.previewOpen;
  document.getElementById('preview-panel').classList.toggle('open', state.previewOpen);
  if (state.previewOpen) refreshPreview();
}

function closeModal() {
  document.getElementById('modal-overlay').style.display = 'none';
}
function closeModalOutside(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}

function modalConfirm() {
  const val = document.getElementById('modal-input').value.trim();
  if (!val) return;
  closeModal();

  if (modalMode === 'file') {
    const base = modalContext || '';
    const path = base ? `${base}/${val}` : `/${val}`;
    if (!state.files[path]) {
      const ext = val.split('.').pop();
      const templates = {
        html: `<!DOCTYPE html>\n<html lang="en">\n<head>\n  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1.0">\n  <title>Document</title>\n</head>\n<body>\n  \n</body>\n</html>`,
        css: `/* Estilos */\n\nbody {\n  margin: 0;\n  font-family: system-ui, sans-serif;\n}\n`,
        js: `// JavaScript\n\nconsole.log('Hello!');\n`
      };
      createFile(path, templates[ext] || '');
    }
    openFile(path);
    renderFileTree();

  } else if (modalMode === 'folder') {
    const base = modalContext || '';
    const path = base ? `${base}/${val}` : `/${val}`;
    state.folders.add(path);
    state.expandedFolders.add(path);
    renderFileTree();

  } else if (modalMode === 'rename') {
    const oldPath = modalContext;
    const dir = oldPath.substring(0, oldPath.lastIndexOf('/'));
    const newPath = dir + '/' + val;
    if (newPath !== oldPath) {
      state.files[newPath] = state.files[oldPath];
      delete state.files[oldPath];
      const ti = state.openTabs.indexOf(oldPath);
      if (ti >= 0) state.openTabs[ti] = newPath;
      if (state.activeFile === oldPath) { state.activeFile = newPath; loadFileInEditor(newPath); }
    }
    renderFileTree(); renderTabs();
  }
}

function deleteFile(path) {
  if (!confirm(`Excluir "${path.split('/').pop()}"?`)) return;
  delete state.files[path];
  const idx = state.openTabs.indexOf(path);
  if (idx >= 0) state.openTabs.splice(idx, 1);
  if (state.activeFile === path) {
    state.activeFile = state.openTabs[0] || null;
    if (state.activeFile) loadFileInEditor(state.activeFile);
    else showWelcome();
  }
  renderFileTree(); renderTabs();
}

function renameFilePrompt(path) {
  modalMode = 'rename'; modalContext = path;
  document.getElementById('modal-title').textContent = 'Renomear';
  document.getElementById('modal-input').value = path.split('/').pop();
  document.getElementById('modal-overlay').style.display = 'flex';
  setTimeout(() => document.getElementById('modal-input').select(), 50);
}

function handleDroppedFile(file) {
  const isImage = /\.(png|jpg|jpeg|gif|svg|webp)$/i.test(file.name);
  if (isImage) {
    const r = new FileReader();
    r.onload = e => { state.images[file.name] = e.target.result; logConsole(`Imagem "${file.name}" importada`, 'info'); renderFileTree(); };
    r.readAsDataURL(file);
  } else if (/\.(html|css|js|txt|json|md)$/i.test(file.name)) {
    const r = new FileReader();
    r.onload = e => { createFile('/' + file.name, e.target.result); openFile('/' + file.name); renderFileTree(); logConsole(`"${file.name}" importado`, 'info'); };
    r.readAsText(file);
  }
}

// EXPORT ZIP
// ══════════════════════════════════════════
async function exportZip() {
  logConsole('Gerando ZIP...', 'info');
  const zipParts = [], centralDir = [];
  let offset = 0;

  function addFile(name, content) {
    const encoder = new TextEncoder();
    const data = typeof content === 'string' ? encoder.encode(content) : content;
    const nameBytes = encoder.encode(name);
    const crc = crc32(data);
    const header = new Uint8Array(30 + nameBytes.length);
    const v = new DataView(header.buffer);
    v.setUint32(0,0x04034b50,true); v.setUint16(4,20,true); v.setUint16(6,0,true);
    v.setUint16(8,0,true); v.setUint16(10,0,true); v.setUint16(12,0,true);
    v.setUint32(14,crc,true); v.setUint32(18,data.length,true); v.setUint32(22,data.length,true);
    v.setUint16(26,nameBytes.length,true); v.setUint16(28,0,true);
    header.set(nameBytes, 30);
    const cd = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(cd.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
    cv.setUint32(16,crc,true); cv.setUint32(20,data.length,true); cv.setUint32(24,data.length,true);
    cv.setUint16(28,nameBytes.length,true); cv.setUint32(42,offset,true);
    cd.set(nameBytes, 46);
    zipParts.push(header, data); centralDir.push(cd);
    offset += header.length + data.length;
  }

  Object.entries(state.files).forEach(([path, f]) => addFile(path.replace(/^\//,''), f.content));
  Object.entries(state.images).forEach(([name, dataUrl]) => {
    const b64 = dataUrl.split(',')[1];
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    addFile('images/'+name, bytes);
  });

  const cdSize = centralDir.reduce((s,d)=>s+d.length,0);
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0,0x06054b50,true); ev.setUint16(8,centralDir.length,true);
  ev.setUint16(10,centralDir.length,true); ev.setUint32(12,cdSize,true); ev.setUint32(16,offset,true);

  const all = [...zipParts,...centralDir,eocd];
  const total = all.reduce((s,p)=>s+p.length,0);
  const zip = new Uint8Array(total);
  let pos = 0;
  all.forEach(p=>{zip.set(p,pos);pos+=p.length;});

  const blob = new Blob([zip],{type:'application/zip'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download='projeto.zip'; a.click();
  URL.revokeObjectURL(url);
  logConsole('ZIP exportado!', 'info');
}

function crc32(data) {
  if (!crc32.t) {
    crc32.t = new Uint32Array(256);
    for(let i=0;i<256;i++){let c=i;for(let j=0;j<8;j++)c=(c&1)?0xEDB88320^(c>>>1):c>>>1;crc32.t[i]=c;}
  }
  let crc=0xFFFFFFFF;
  for(let i=0;i<data.length;i++) crc=crc32.t[(crc^data[i])&0xFF]^(crc>>>8);
  return (crc^0xFFFFFFFF)>>>0;
}

// ══════════════════════════════════════════
// ACTIVITY / PANELS
// ══════════════════════════════════════════
function setActivity(name) {
  state.currentActivity = name;
  document.querySelectorAll('.act-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('act-' + name)?.classList.add('active');
  const titles = { explorer:'EXPLORER', images:'IMAGENS', search:'BUSCA' };
  document.getElementById('sidebar-title').textContent = titles[name] || name.toUpperCase();
  renderFileTree();
}

function renderImagesPanel() {
  const tree = document.getElementById('file-tree');
  const imgs = Object.entries(state.images);
  tree.innerHTML = `
    <div style="padding:8px 12px 4px;font-size:11px;color:var(--text-muted);">${imgs.length} imagem(s)</div>
    <div style="margin:4px 8px;display:flex;gap:6px;align-items:center;cursor:pointer;color:var(--accent);font-size:12px;padding:4px;" onclick="importImageClick()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Adicionar Imagem
    </div>
    <div id="images-panel">
      ${imgs.map(([name, url]) => `
        <div class="img-thumb" title="${name}" onclick="insertImageRef('${name}')">
          <img src="${url}" alt="${name}">
          <div class="img-name">${name}</div>
        </div>`).join('')}
      ${!imgs.length ? '<div style="padding:12px;color:var(--text-muted);font-size:12px;">Arraste imagens para o editor ou clique acima.</div>' : ''}
    </div>`;
}

function importImageClick() {
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='image/*'; inp.multiple=true;
  inp.onchange = e => [...e.target.files].forEach(f => {
    const r = new FileReader();
    r.onload = ev => { state.images[f.name]=ev.target.result; renderFileTree(); logConsole(`Imagem "${f.name}" adicionada`,'info'); };
    r.readAsDataURL(f);
  });
  inp.click();
}

function insertImageRef(name) {
  if (!state.activeFile) return;
  const file = state.files[state.activeFile];
  const input = document.getElementById('code-input');
  const pos = input.selectionStart;
  let snippet = file.language === 'HTML' ? `<img src="${name}" alt="">` :
                file.language === 'CSS'  ? `url('${name}')` : `'${name}'`;
  input.value = input.value.substring(0, pos) + snippet + input.value.substring(pos);
  input.setSelectionRange(pos+snippet.length, pos+snippet.length);
  saveCurrentFile(); updateDisplay(); updateLineNumbers();
}

function renderSearchPanel() {
  const tree = document.getElementById('file-tree');
  tree.innerHTML = `
    <div style="padding:8px;">
      <input id="search-input" type="text" placeholder="Buscar no projeto..." style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:7px 10px;color:var(--text);font-family:inherit;font-size:12px;outline:none;" oninput="doSearch(this.value)">
    </div>
    <div id="search-results" style="padding:4px 8px;font-size:12px;"></div>`;
  setTimeout(()=>document.getElementById('search-input')?.focus(),50);
}

function doSearch(query) {
  const results = document.getElementById('search-results');
  if (!query.trim()) { results.innerHTML=''; return; }
  const found = [];
  Object.entries(state.files).forEach(([path, f]) => {
    f.content.split('\n').forEach((line, i) => {
      if (line.toLowerCase().includes(query.toLowerCase()))
        found.push({ path, line: i+1, text: line.trim() });
    });
  });
  if (!found.length) { results.innerHTML='<div style="color:var(--text-muted);padding:8px 0;">Nenhum resultado</div>'; return; }
  results.innerHTML = found.slice(0,30).map(r => `
    <div onclick="openFile('${r.path}')" style="padding:6px 4px;cursor:pointer;border-radius:4px;" onmouseover="this.style.background='var(--hover)'" onmouseout="this.style.background=''">
      <div style="color:var(--accent);font-size:11px;">${r.path} <span style="color:var(--text-muted)">:${r.line}</span></div>
      <div style="color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${r.text}</div>
    </div>`).join('');
}

// ══════════════════════════════════════════
// THEME
// ══════════════════════════════════════════
function setTheme(cls) {
  document.body.className = cls;
  document.getElementById('theme-picker').classList.remove('open');
}
function toggleThemePicker() {
  document.getElementById('theme-picker').classList.toggle('open');
}

// ══════════════════════════════════════════
// CONTEXT MENU
// ══════════════════════════════════════════
function showCtxMenu(e, type, path) {
  const menu = document.getElementById('ctx-menu');
  const items = type === 'file' ? [
    { label:'Abrir', action:`openFile('${path}')` },
    { label:'Renomear', action:`renameFilePrompt('${path}')` },
    { sep:true },
    { label:'Excluir', action:`deleteFile('${path}')`, danger:true },
  ] : [
    { label:'Novo arquivo aqui', action:`showNewFileModal('${path}')` },
    { sep:true },
    { label:'Excluir pasta', action:`deleteFile('${path}')`, danger:true },
  ];
  menu.innerHTML = items.map(item => item.sep ? '<div class="ctx-sep"></div>' :
    `<div class="ctx-item${item.danger?' danger':''}" onclick="${item.action};hideCtxMenu()">${item.label}</div>`).join('');
  menu.style.display='block';
  menu.style.left=Math.min(e.clientX,window.innerWidth-200)+'px';
  menu.style.top=Math.min(e.clientY,window.innerHeight-200)+'px';
}
function hideCtxMenu() { document.getElementById('ctx-menu').style.display='none'; }
document.addEventListener('click', hideCtxMenu);

// ══════════════════════════════════════════
// CONSOLE
// ══════════════════════════════════════════
function logConsole(msg, type='') {
  const out = document.getElementById('console-output');
  document.getElementById('bottom-panel').style.display='flex';
  const div = document.createElement('div');
  div.className = `console-line ${type}`;
  div.innerHTML = `<span class="console-prefix">[${new Date().toLocaleTimeString()}]</span><span>${msg}</span>`;
  out.appendChild(div);
  out.scrollTop = out.scrollHeight;
}

function switchPanel(name, event) {
  document.querySelectorAll('.panel-tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
}

// ══════════════════════════════════════════
// DRAG RESIZE
// ══════════════════════════════════════════
const dragHandle = document.getElementById('drag-handle');
let isDragging = false;
dragHandle.addEventListener('mousedown', () => isDragging = true);
document.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const sidebar = document.getElementById('sidebar');
  const rect = document.getElementById('main').getBoundingClientRect();
  sidebar.style.width = Math.max(150, Math.min(400, e.clientX - rect.left - 48)) + 'px';
});
document.addEventListener('mouseup', () => isDragging = false);

// Theme picker close on outside click
document.addEventListener('click', e => {
  const tp = document.getElementById('theme-picker');
  if (!e.target.closest('.act-btn') && !tp.contains(e.target)) tp.classList.remove('open');
});

// Global shortcuts
document.addEventListener('keydown', e => {
  if ((e.ctrlKey||e.metaKey) && e.key==='p') { e.preventDefault(); togglePreview(); }
  if ((e.ctrlKey||e.metaKey) && e.key==='n') { e.preventDefault(); showNewFileModal(); }
});
</script>
</body>
</html>
